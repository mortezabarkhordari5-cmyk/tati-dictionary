<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <title>واژه‌نامه تاتی</title>
    <style>
        body { font-family: Tahoma, sans-serif; padding: 20px; line-height: 1.6; }
        input { width: 100%; padding: 10px; font-size: 18px; margin-bottom: 20px; border: 2px solid #ccc; border-radius: 5px; }
        .word { border-bottom: 1px solid #eee; padding: 10px 0; }
        strong { color: #d32f2f; }
    </style>
</head>
<body>
    <h1>واژه‌نامه تاتی</h1>
    <input type="text" id="search" placeholder="جستجوی کلمه...">
    <div id="results"></div>

    <script src="data.js"></script>
    <script>
        const resultsDiv = document.getElementById('results');
        const searchInput = document.getElementById('search');

        function displayWords(filter = "") {
            resultsDiv.innerHTML = "";
            const filtered = words.filter(w => (w[0] && w[0].includes(filter)) || (w[1] && w[1].includes(filter)));
            filtered.forEach(w => {
                const div = document.createElement('div');
                div.className = 'word';
                div.innerHTML = `<strong>${w[0]}</strong>: ${w[1]}`;
                resultsDiv.appendChild(div);
            });
        }

        searchInput.addEventListener('input', (e) => displayWords(e.target.value));
        displayWords();
    </script>
</body>
</html>
