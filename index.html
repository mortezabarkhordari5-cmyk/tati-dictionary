<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لغت‌نامه تاتی الموتی | مرجع واژگان گویشی</title>
    <meta name="description" content="دانلود لغت‌نامه جامع تاتی الموتی. مرجع کامل واژگان، اصطلاحات قدیمی و گویش تاتی منطقه الموت قزوین.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        :root {
            --bg-page: linear-gradient(180deg, #f0f4f8 0%, #f7f9fb 100%);
            --text-color: #2c3e50;
            --title-color: #1a365d;
            --card-bg: #fff;
            --table-border: #e2e8f0;
            --row-even: #f8fafc;
            --row-hover: #e0f2fe;
            --sticky-bg: rgba(240, 244, 248, 0.95);
            --modal-bg: #fff;
            --modal-text: #0f172a;
        }
        body.dark-mode {
            --bg-page: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            --text-color: #e2e8f0;
            --title-color: #93c5fd;
            --card-bg: #1e293b;
            --table-border: #334155;
            --row-even: #182234;
            --row-hover: #1e3a5f;
            --sticky-bg: rgba(15, 23, 42, 0.95);
            --modal-bg: #1e293b;
            --modal-text: #f1f5f9;
        }
        body { 
            user-select: none; 
            -webkit-user-select: none; 
            font-family: 'Vazirmatn', Tahoma, Arial, sans-serif; 
            background: var(--bg-page); 
            min-height: 100vh; 
            color: var(--text-color); 
            margin: 0; 
            padding: 16px 12px; 
            padding-bottom: 95px; 
            text-align: center; 
            transition: background 0.3s, color 0.3s;
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; max-width: 460px; margin: 0 auto; padding: 0 4px; }
        .theme-toggle-btn { background: rgba(0, 0, 0, 0.05); border: 1px solid rgba(0, 0, 0, 0.1); color: inherit; padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 5px; }
        body.dark-mode .theme-toggle-btn { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.2); }
        h1 { color: var(--title-color); margin: 6px 0; font-size: 26px; font-weight: 800; }
        #author { font-size: 15px; font-weight: 700; color: #c0392b; margin-bottom: 12px; background: rgba(231, 76, 60, 0.08); display: inline-block; padding: 4px 14px; border-radius: 20px; }
        body.dark-mode #author { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .random-card-wrapper { max-width: 460px; margin: 0 auto 12px auto; background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%); color: #ffffff; border-radius: 14px; padding: 14px 16px; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25); text-align: center; }
        .random-card-title { font-size: 12px; color: #bfdbfe; font-weight: 600; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        .random-card-word { font-size: 22px; font-weight: 800; color: #ffffff; margin-bottom: 4px; }
        .random-card-meaning { font-size: 15px; color: #f1f5f9; margin-bottom: 10px; line-height: 1.5; }
        .random-card-actions { display: flex; gap: 8px; justify-content: center; }
        .random-btn { background: rgba(255, 255, 255, 0.18); border: 1px solid rgba(255, 255, 255, 0.35); color: #fff; padding: 6px 14px; border-radius: 8px; font-size: 12px; cursor: pointer; font-family: inherit; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
        .spin-icon { display: inline-block; transition: transform 0.4s ease; }
        .spin { transform: rotate(360deg); }
        .sticky-header { position: sticky; top: 0; background: var(--sticky-bg); backdrop-filter: blur(8px); padding: 6px 0; z-index: 1000; }
        #search-input { width: 95%; max-width: 460px; padding: 13px 18px; margin-bottom: 8px; border: 2px solid #3b82f6; border-radius: 14px; font-family: inherit; font-size: 16px; outline: none; background: var(--card-bg); color: inherit; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.12); }
        .counter-row { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 6px; }
        #result-count { font-size: 13px; color: var(--text-color); font-weight: 600; opacity: 0.85; }
        .filter-fav-btn { background: none; border: 1px dashed #3b82f6; color: #2563eb; border-radius: 12px; font-size: 12px; padding: 2px 10px; cursor: pointer; font-family: inherit; font-weight: 700; }
        .filter-fav-btn.active { background: #3b82f6; color: #fff; border-style: solid; }
        .table-container { width: 100%; max-width: 760px; margin: 8px auto 0 auto; border-radius: 12px; overflow: hidden; border: 1px solid var(--table-border); background: var(--card-bg); }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 14px 16px; font-size: 17px; line-height: 1.6; border-bottom: 1px solid var(--table-border); }
        thead th { background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); color: #ffffff; font-weight: 700; border: none; }
        tbody tr:nth-child(even) { background-color: var(--row-even); }
        tbody tr:hover { background-color: var(--row-hover); }
        tbody td:first-child { font-weight: 700; color: #2563eb; border-left: 1px solid var(--table-border); }
        body.dark-mode tbody td:first-child { color: #93c5fd; }
        tbody td:last-child { color: var(--text-color); }
        .fav-star { cursor: pointer; font-size: 18px; margin-left: 6px; color: #cbd5e1; transition: color 0.2s, transform 0.2s; display: inline-block; vertical-align: middle; }
        .fav-star.active { color: #f59e0b; transform: scale(1.15); }
        .btn-float-container { position: fixed; bottom: 14px; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; z-index: 1000; padding: 0 10px; pointer-events: none; }
        .btn-float { pointer-events: auto; padding: 11px 15px; border: none; border-radius: 25px; cursor: pointer; color: #fff; font-family: inherit; font-weight: 700; box-shadow: 0 6px 18px rgba(0,0,0,0.22); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
        #quizBtn { background: linear-gradient(135deg, #f59e0b, #d97706); }
        #suggestBtn { background: linear-gradient(135deg, #16a34a, #22c55e); }
        #moreBtn { background: linear-gradient(135deg, #0284c7, #38bdf8); }
        .overlay { display: none; position: fixed; inset: 0; z-index: 10001; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(3px); }
        .custom-modal { display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 10002; width: min(92vw, 520px); max-height: 85vh; background: var(--modal-bg); color: var(--modal-text); border-radius: 16px; padding: 18px; overflow-y: auto; text-align: right; box-shadow: 0 20px 35px rgba(0,0,0,0.3); font-family: inherit; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--table-border); padding-bottom: 10px; margin-bottom: 14px; }
        .close-btn { border: none; background: transparent; font-size: 26px; cursor: pointer; color: #94a3b8; }
        .sticky-modal-header { position: sticky; top: -18px; background: var(--modal-bg); padding-top: 4px; z-index: 20; margin: -18px -18px 10px -18px; padding-left: 18px; padding-right: 18px; }
        #village-search { width: 100%; padding: 11px 14px; border: 1.5px solid #cbd5e1; border-radius: 10px; margin-bottom: 12px; background: var(--card-bg); color: inherit; font-family: inherit; }
        .filter-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .tab-btn { flex: 1; padding: 9px; border: 1px solid var(--table-border); background: var(--row-even); border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: 600; color: var(--text-color); }
        .tab-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
        .village-item { padding: 13px 15px; border: 1px solid var(--table-border); border-radius: 10px; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); }
        .quiz-option-btn { width: 100%; padding: 12px 14px; margin-bottom: 10px; border: 1.5px solid var(--table-border); background: var(--row-even); border-radius: 10px; text-align: right; font-family: inherit; font-size: 15px; cursor: pointer; font-weight: 600; color: var(--text-color); }
        .quiz-option-btn.correct { background: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; }
        .quiz-option-btn.wrong { background: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }
        .seo-footer { margin-top: 30px; padding: 15px; font-size: 12px; color: #7f8c8d; text-align: center; }
    </style>
</head>
<body>
    <div class="header-top">
        <button class="theme-toggle-btn" onclick="toggleDarkMode()" aria-label="تغییر تم">
            <span id="theme-icon">🌙</span>
            <span id="theme-text">حالت شب</span>
        </button>
        <div style="font-size: 11px; opacity: 0.6; font-weight: 600;">نسخه ۴.۵</div>
    </div>

    <h1>لغت‌نامه تاتی الموتی</h1>
    <div id="author">گردآورنده: مرتضی برخورداری</div>

    <!-- کارت کلمه تصادفی -->
    <div class="random-card-wrapper" id="random-card">
        <div class="random-card-title">
            <span>💡 کلمه پیشنهادی</span>
            <span id="fav-status-random"></span>
        </div>
        <div class="random-card-word" id="random-word">در حال بارگذاری...</div>
        <div class="random-card-meaning" id="random-meaning">لطفاً شکیبا باشید.</div>
        <div class="random-card-actions">
            <button class="random-btn" onclick="generateRandomWord()">
                <span class="spin-icon" id="refresh-icon">🔄</span>
                کلمه بعدی
            </button>
            <button class="random-btn" id="fav-btn-random" onclick="toggleFavRandom()">
                ⭐ نشان کردن
            </button>
        </div>
    </div>

    <div class="sticky-header">
        <input type="text" id="search-input" placeholder="جستجوی واژه (تاتی یا فارسی)..." onkeyup="searchWords()" autocomplete="off">
        <div class="counter-row">
            <div id="result-count">در حال آماده‌سازی...</div>
            <button id="filter-fav-btn" class="filter-fav-btn" onclick="toggleFavFilter()">⭐ علاقه‌مندی‌ها</button>
        </div>
    </div>

    <div class="table-container">
        <table id="word-table">
            <thead>
                <tr>
                    <th style="width: 40%;">تاتی</th>
                    <th>معنی فارسی</th>
                </tr>
            </thead>
            <tbody id="word-list">
                <!-- لیست کلمات اینجا نمایش داده می‌شود -->
            </tbody>
        </table>
    </div>

    <!-- دکمه‌های شناور پایین صفحه -->
    <div class="btn-float-container">
        <button class="btn-float" id="quizBtn" onclick="openQuiz()">
            <span>🏆</span> آزمون
        </button>
        <button class="btn-float" id="moreBtn" onclick="openVillageModal()">
            <span>🏘️</span> روستاهای الموت
        </button>
        <button class="btn-float" id="suggestBtn" onclick="window.location.href='mailto:morteza.barkhordari5@gmail.com'">
            <span>📩</span> پیشنهاد کلمه
        </button>
    </div>

    <div class="seo-footer">
        لغت‌نامه آنلاین تاتی الموتی | حفظ میراث زبانی منطقه الموت قزوین
    </div>

    <!-- مدال‌ها و لایه‌های رویی -->
    <div class="overlay" id="overlay" onclick="closeAllModals()"></div>

    <!-- مدال آزمون -->
    <div id="quizModal" class="custom-modal">
        <div class="modal-header">
            <h3 style="margin:0">🏆 خودآزمایی تاتی</h3>
            <button class="close-btn" onclick="closeAllModals()">&times;</button>
        </div>
        <div id="quiz-content">
            <p id="quiz-question" style="font-weight:700; font-size:18px; margin-bottom:20px;"></p>
            <div id="quiz-options"></div>
            <p id="quiz-feedback" style="margin-top:15px; font-weight:700;"></p>
            <button class="tab-btn" onclick="generateQuiz()" style="margin-top:10px; background:#f8fafc; color:#334155;">سوال بعدی</button>
        </div>
    </div>

    <!-- مدال روستاهای الموت -->
    <div id="villageModal" class="custom-modal">
        <div class="sticky-modal-header">
            <div class="modal-header">
                <h3 style="margin:0">🏘️ راهنمای روستاهای الموت</h3>
                <button class="close-btn" onclick="closeAllModals()">&times;</button>
            </div>
            <input type="text" id="village-search" placeholder="جستجوی نام روستا..." onkeyup="filterVillages()">
            <div class="filter-tabs">
                <button class="tab-btn active" id="tab-all" onclick="setVillageRegion('all')">همه</button>
                <button class="tab-btn" id="tab-shargh" onclick="setVillageRegion('shargh')">الموت شرقی</button>
                <button class="tab-btn" id="tab-gharb" onclick="setVillageRegion('gharb')">الموت غربی</button>
            </div>
        </div>
        <div id="village-list"></div>
    </div>

    <!-- دیتابیس کلمات -->
    <script src="data.js"></script>

    <script>
        // تطبیق خودکار با متغیر words در data.js
        let wordsDatabase = [];
        if (typeof words !== 'undefined' && Array.isArray(words)) {
            wordsDatabase = words.map(item => [item.tati || '', item.farsi || '']);
        } else if (typeof window.words !== 'undefined' && Array.isArray(window.words)) {
            wordsDatabase = window.words.map(item => [item.tati || '', item.farsi || '']);
        }

        // دیتای روستاهای الموت
        const alamutVillages = [
            { name: "گازرخان", region: "shargh", desc: "دامنه قلعه حسن صباح، پایتخت اسماعیلیان الموت" },
            { name: "معلم‌کلایه", region: "shargh", desc: "مرکز بخش الموت شرقی" },
            { name: "گرمارود", region: "shargh", desc: "انتهای دره الموت و مسیر کاروان‌رو به مازندران" },
            { name: "اویرک", region: "shargh", desc: "روستایی سرسبز در منطقه الموت شرقی" },
            { name: "اندج", region: "shargh", desc: "معروف به صخره‌ها و دره‌های شگفت‌انگیز طبیعی" },
            { name: "رازمیان", region: "gharb", desc: "مرکز بخش الموت غربی، نزدیک قلعه لمبسر" },
            { name: "هیر", region: "gharb", desc: "پایتخت زغال‌اخته ایران با باغات فراوان" },
            { name: "ویار", region: "gharb", desc: "روستایی کوهستانی در الموت غربی" },
            { name: "رجایی‌دشت", region: "gharb", desc: "چهارراه اصلی و ورودی رودخانه شاهرود" },
            { name: "فلار", region: "gharb", desc: "روستایی با باغات فندق و طبیعت کوهستانی" }
        ];

        let favorites = JSON.parse(localStorage.getItem('tati_favs') || '[]');
        let currentRandomWord = null;
        let showOnlyFavs = false;
        let selectedVillageRegion = 'all';

        // لرزش دکمه‌ها (Haptic)
        function triggerHaptic() {
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(25);
            }
        }

        // حالت شب و روز (Dark Mode)
        function initTheme() {
            const isDark = localStorage.getItem('tati_dark') === 'true';
            if (isDark) {
                document.body.classList.add('dark-mode');
                document.getElementById('theme-icon').textContent = '☀️';
                document.getElementById('theme-text').textContent = 'حالت روز';
            }
        }

        function toggleDarkMode() {
            triggerHaptic();
            const body = document.body;
            body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');
            localStorage.setItem('tati_dark', isDark);
            document.getElementById('theme-icon').textContent = isDark ? '☀️' : '🌙';
            document.getElementById('theme-text').textContent = isDark ? 'حالت روز' : 'حالت شب';
        }

        // سیستم علاقه‌مندی‌ها (Favorites)
        function toggleFavorite(word, event) {
            if (event) event.stopPropagation();
            triggerHaptic();
            const index = favorites.indexOf(word);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(word);
            }
            localStorage.setItem('tati_favs', JSON.stringify(favorites));
            
            if (currentRandomWord && currentRandomWord[0] === word) {
                updateRandomFavBtn();
            }
            if (showOnlyFavs) {
                searchWords();
            } else {
                updateFavIconsInTable();
            }
        }

        function updateFavIconsInTable() {
            document.querySelectorAll('.fav-star').forEach(star => {
                const w = star.getAttribute('data-word');
                if (favorites.includes(w)) {
                    star.classList.add('active');
                    star.textContent = '★';
                } else {
                    star.classList.remove('active');
                    star.textContent = '☆';
                }
            });
        }

        function toggleFavFilter() {
            triggerHaptic();
            showOnlyFavs = !showOnlyFavs;
            const btn = document.getElementById('filter-fav-btn');
            if (showOnlyFavs) {
                btn.classList.add('active');
                btn.textContent = '★ همه‌ی واژه‌ها';
            } else {
                btn.classList.remove('active');
                btn.textContent = '⭐ علاقه‌مندی‌ها';
            }
            searchWords();
        }

        // کلمه تصادفی
        function generateRandomWord() {
            triggerHaptic();
            const icon = document.getElementById('refresh-icon');
            if (icon) {
                icon.classList.remove('spin');
                void icon.offsetWidth;
                icon.classList.add('spin');
            }

            if (wordsDatabase.length > 0) {
                const randomIndex = Math.floor(Math.random() * wordsDatabase.length);
                currentRandomWord = wordsDatabase[randomIndex];
                document.getElementById('random-word').innerText = currentRandomWord[0];
                document.getElementById('random-meaning').innerText = currentRandomWord[1];
                updateRandomFavBtn();
            }
        }

        function updateRandomFavBtn() {
            const favBtn = document.getElementById('fav-btn-random');
            if (!currentRandomWord) return;
            const isFav = favorites.includes(currentRandomWord[0]);
            favBtn.innerHTML = isFav ? '★ نشان‌شده' : '⭐ نشان کردن';
        }

        function toggleFavRandom() {
            if (currentRandomWord) {
                toggleFavorite(currentRandomWord[0]);
            }
        }

        // جستجو و نمایش جدول
        function searchWords() {
            const query = document.getElementById('search-input').value.trim().toLowerCase();
            const tbody = document.getElementById('word-list');
            const counter = document.getElementById('result-count');
            
            if (!wordsDatabase || wordsDatabase.length === 0) {
                counter.innerText = 'خطا در بارگذاری داده‌ها!';
                return;
            }

            let filtered = wordsDatabase.filter(item => {
                const matchQuery = !query || item[0].toLowerCase().includes(query) || item[1].toLowerCase().includes(query);
                const matchFav = !showOnlyFavs || favorites.includes(item[0]);
                return matchQuery && matchFav;
            });

            counter.innerText = `نمایش ${filtered.length.toLocaleString('fa-IR')} از ${wordsDatabase.length.toLocaleString('fa-IR')} واژه`;

            let html = '';
            filtered.forEach(item => {
                const isFav = favorites.includes(item[0]);
                const starIcon = isFav ? '★' : '☆';
                const starClass = isFav ? 'fav-star active' : 'fav-star';
                html += `
                    <tr>
                        <td>
                            <span class="${starClass}" data-word="${item[0]}" onclick="toggleFavorite('${item[0]}', event)">${starIcon}</span>
                            ${item[0]}
                        </td>
                        <td>${item[1]}</td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        // کنترل مدال‌ها
        function closeAllModals() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('quizModal').style.display = 'none';
            document.getElementById('villageModal').style.display = 'none';
        }

        function openModal(id) {
            triggerHaptic();
            document.getElementById('overlay').style.display = 'block';
            document.getElementById(id).style.display = 'block';
        }

        // بخش آزمون (کوییز)
        function openQuiz() {
            openModal('quizModal');
            generateQuiz();
        }

        function generateQuiz() {
            if (!wordsDatabase || wordsDatabase.length < 4) return;
            document.getElementById('quiz-feedback').innerText = '';
            
            const questionIndex = Math.floor(Math.random() * wordsDatabase.length);
            const questionWord = wordsDatabase[questionIndex];
            document.getElementById('quiz-question').innerText = `معنی واژه «${questionWord[0]}» چیست؟`;

            let options = [questionWord[1]];
            while (options.length < 4) {
                const r = Math.floor(Math.random() * wordsDatabase.length);
                const mean = wordsDatabase[r][1];
                if (!options.includes(mean)) options.push(mean);
            }
            options.sort(() => Math.random() - 0.5);

            let optionsHtml = '';
            options.forEach(opt => {
                const safeOpt = opt.replace(/'/g, "\\'");
                const safeCorrect = questionWord[1].replace(/'/g, "\\'");
                optionsHtml += `<button class="quiz-option-btn" onclick="checkAnswer(this, '${safeOpt}', '${safeCorrect}')">${opt}</button>`;
            });
            document.getElementById('quiz-options').innerHTML = optionsHtml;
        }

        function checkAnswer(btn, selected, correct) {
            triggerHaptic();
            const allBtns = document.querySelectorAll('.quiz-option-btn');
            allBtns.forEach(b => b.disabled = true);
            const feedback = document.getElementById('quiz-feedback');

            if (selected === correct) {
                btn.classList.add('correct');
                feedback.style.color = '#16a34a';
                feedback.innerText = '✅ آفرین! کاملاً درسته.';
            } else {
                btn.classList.add('wrong');
                feedback.style.color = '#dc2626';
                feedback.innerText = `❌ اشتباه بود! پاسخ درست: ${correct}`;
                allBtns.forEach(b => {
                    if (b.innerText === correct) b.classList.add('correct');
                });
            }
        }

        // بخش روستاها
        function openVillageModal() {
            openModal('villageModal');
            renderVillages();
        }

        function setVillageRegion(region) {
            triggerHaptic();
            selectedVillageRegion = region;
            document.querySelectorAll('.filter-tabs .tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${region}`).classList.add('active');
            renderVillages();
        }

        function filterVillages() {
            renderVillages();
        }

        function renderVillages() {
            const search = document.getElementById('village-search').value.trim().toLowerCase();
            const list = document.getElementById('village-list');
            
            const filtered = alamutVillages.filter(v => {
                const matchRegion = selectedVillageRegion === 'all' || v.region === selectedVillageRegion;
                const matchSearch = !search || v.name.includes(search) || v.desc.includes(search);
                return matchRegion && matchSearch;
            });

            let html = '';
            filtered.forEach(v => {
                const tag = v.region === 'shargh' ? 'الموت شرقی' : 'الموت غربی';
                html += `
                    <div class="village-item" onclick="searchVillageInDict('${v.name}')">
                        <div>
                            <div style="font-weight:700; font-size:16px;">${v.name}</div>
                            <div style="font-size:12px; color:#64748b; margin-top:3px;">${v.desc}</div>
                        </div>
                        <span style="font-size:11px; background:rgba(37,99,235,0.1); color:#2563eb; padding:3px 8px; border-radius:12px; font-weight:600;">${tag}</span>
                    </div>
                `;
            });
            list.innerHTML = html || '<p style="text-align:center; color:#94a3b8; padding:15px;">روستایی یافت نشد.</p>';
        }

        function searchVillageInDict(name) {
            closeAllModals();
            const input = document.getElementById('search-input');
            input.value = name;
            searchWords();
            window.scrollTo({ top: input.offsetTop - 70, behavior: 'smooth' });
        }

        // راه‌اندازی اولیه صفحه
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            if (wordsDatabase.length > 0) {
                searchWords();
                generateRandomWord();
            } else {
                document.getElementById('result-count').innerText = 'دیتای کلمات یافت نشد (بررسی data.js)';
            }
        });
    </script>
</body>
</html>
