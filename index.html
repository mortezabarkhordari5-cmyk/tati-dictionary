<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>واژه‌نامه تاتی ایزگیرینی</title>
  <style>
    :root {
      --primary: #257038;
      --primary-dark: #1b5228;
      --tati-color: #b71c1c;
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #212529;
      --text-muted: #6c757d;
      --border: #e2e8f0;
      --th-bg: #eaf5ea;
    }

    /* جلوگیری از انتخاب و کپی متن */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Vazirmatn', Tahoma, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 12px;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
    }

    /* کادر سبز بالای صفحه */
    .header-card {
      background: var(--primary);
      color: #ffffff;
      text-align: center;
      padding: 1.4rem 1rem;
      border-radius: 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 10px rgba(37, 112, 56, 0.2);
    }

    .header-card h1 {
      font-size: 1.45rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .header-card p {
      font-size: 0.95rem;
      opacity: 0.95;
    }

    /* کادر جستجو */
    .search-box {
      margin-bottom: 12px;
    }

    .search-box input {
      width: 100%;
      border: 1.5px solid #2c3e50;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      outline: none;
      background: #ffffff;
      direction: rtl;
      text-align: center;
      -webkit-user-select: text !important;
      user-select: text !important;
    }

    .search-box input::placeholder {
      color: #888;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    /* جدول واژگان */
    .table-container {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: right;
    }

    th {
      background-color: var(--th-bg);
      color: var(--primary);
      font-weight: bold;
      font-size: 1.05rem;
      padding: 12px 14px;
      border-bottom: 2px solid #d4ebd4;
    }

    th.col-tati {
      width: 40%;
    }

    th.col-mean {
      width: 60%;
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      font-size: 0.98rem;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .tati-word {
      color: var(--tati-color);
      font-weight: 700;
      font-size: 1.05rem;
    }

    .persian-mean {
      color: #2b2b2b;
    }

    /* پیام در صورت نیافتن لغت */
    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
      display: none;
      background: #fff;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <div class="container">
    <!-- هدر سبز رنگ -->
    <div class="header-card">
      <h1>واژه‌نامه تاتی ایزگیرینی</h1>
      <p id="statsCount">در حال بارگذاری...</p>
    </div>

    <!-- کادر جستجو -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="جستجو در لغات (تاتی یا فارسی)...">
    </div>

    <!-- جدول واژگان -->
    <div class="table-container" id="tableContainer">
      <table>
        <thead>
          <tr>
            <th class="col-tati">تاتی</th>
            <th class="col-mean">معنی</th>
          </tr>
        </thead>
        <tbody id="wordTableBody"></tbody>
      </table>
    </div>

    <div class="empty-state" id="emptyState">
      واژه‌ای با این مشخصات پیدا نشد.
    </div>
  </div>

    // تابع تمیزکاری برای جستجو و مرتب‌سازی دقیق
    function normalizeText(text) {
      return text
        .replace(/[\u064B-\u065F\u0670]/g, '') // حذف اعراب
        .replace(/[یي]/g, 'ی')
        .replace(/[کك]/g, 'ک')
        .replace(/آ/g, 'ا')
        .toLowerCase()
        .trim();
    }

    // مرتب‌سازی الفبایی هوشمند
    const WORDS = RAW_WORDS.sort((a, b) => {
      const cleanA = normalizeText(a[0]);
      const cleanB = normalizeText(b[0]);
      return cleanA.localeCompare(cleanB, 'fa');
    });

    const searchInput = document.getElementById('searchInput');
    const wordTableBody = document.getElementById('wordTableBody');
    const tableContainer = document.getElementById('tableContainer');
    const statsCount = document.getElementById('statsCount');
    const emptyState = document.getElementById('emptyState');

    function render(filter = '') {
      const q = normalizeText(filter);
      const filtered = WORDS.filter(w => {
        if (!q) return true;
        const tat = normalizeText(w[0]);
        const per = normalizeText(w[1]);
        return tat.includes(q) || per.includes(q);
      });

      statsCount.textContent = `${filtered.length} نتیجه یافت شد`;

      if (filtered.length === 0) {
        tableContainer.style.display = 'none';
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';
      tableContainer.style.display = 'block';
      
      wordTableBody.innerHTML = filtered.map(w => `
        <tr>
          <td class="tati-word">${w[0]}</td>
          <td class="persian-mean">${w[1]}</td>
        </tr>
      `).join('');
    }

    searchInput.addEventListener('input', (e) => {
      render(e.target.value);
    });

    // کدهای ضد کپی
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('cut', e => e.preventDefault());
    document.addEventListener('selectstart', e => {
      if (e.target.tagName !== 'INPUT') e.preventDefault();
    });
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && ['c', 'u', 's', 'p'].includes(e.key.toLowerCase())) {
        e.preventDefault();
      }
    });

    // بارگذاری اولیه
    render();
  </script>
