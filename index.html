<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لغت‌نامه تاتی الموتی</title>
</head>
<body style="font-family: Tahoma; text-align: center; padding: 20px;">
    <h2>لغت‌نامه تاتی الموتی</h2>
    <div id="status" style="color:red;">در حال بارگذاری...</div>
    <table id="wordTable" style="width: 100%; border-collapse: collapse; margin-top: 20px;">
        <tbody id="results"></tbody>
    </table>

    <script src="data.js"></script>
    <script>
        // تست اینکه آیا data.js درست لود شده یا نه
        try {
            const list = (typeof words !== 'undefined') ? words : [];
            const tbody = document.getElementById('results');
            
            if (list.length === 0) {
                document.getElementById('status').innerText = "خطا: داده‌ای یافت نشد. فایل data.js را چک کنید.";
            } else {
                document.getElementById('status').style.display = 'none';
                list.forEach((w, i) => {
                    tbody.innerHTML += `<tr><td>${i + 1}</td><td>${w.tati}</td><td>${w.farsi}</td></tr>`;
                });
            }
        } catch (e) {
            document.getElementById('status').innerText = "خطا در بارگذاری: " + e.message;
        }
    </script>
</body>
</html>
