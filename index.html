const wordsList = document.getElementById('wordsList');
const searchInput = document.getElementById('searchInput');
const countDisplay = document.getElementById('countDisplay');

function render(list) {
  wordsList.innerHTML = '';
  countDisplay.textContent = `نمایش ${list.length} واژه از ${words.length} واژه`;

  if (list.length === 0) {
    wordsList.innerHTML = '<div class="empty">واژه‌ای با این مشخصات پیدا نشد.</div>';
    return;
  }

  list.forEach(item => {
    const card = document.createElement('div');
    card.className = 'word-card';
    card.innerHTML = `
      <div class="word-tati">${item.tati}</div>
      <div class="word-fa">${item.fa}</div>
    `;
    wordsList.appendChild(card);
  });
}

searchInput.addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) {
    render(words);
    return;
  }
  const filtered = words.filter(w => 
    w.tati.toLowerCase().includes(q) || w.fa.toLowerCase().includes(q)
  );
  render(filtered);
});

render(words);
