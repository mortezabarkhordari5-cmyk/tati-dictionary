<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>واژه‌نامه تاتی (ایزگیرینی)</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    input {
      -webkit-user-select: auto !important;
      -moz-user-select: auto !important;
      -ms-user-select: auto !important;
      user-select: auto !important;
    }
    body {
      background-color: #f8fafc;
      color: #1e293b;
      padding-bottom: 30px;
    }
    header {
      background: #2563eb;
      color: white;
      padding: 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    h1 {
      font-size: 1.2rem;
      margin-bottom: 10px;
      font-weight: 700;
    }
    .search-box {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }
    .search-box input {
      width: 100%;
      padding: 11px 18px;
      border-radius: 25px;
      border: none;
      font-size: 0.95rem;
      outline: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      background: #ffffff;
      color: #0f172a;
    }
    .alphabet-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 10px 14px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      position: sticky;
      top: 93px;
      z-index: 10;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }
    .alpha-btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #334155;
      font-size: 0.88rem;
      cursor: pointer;
      font-weight: 600;
      flex-shrink: 0;
    }
    .alpha-btn.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }
    .container {
      max-width: 540px;
      margin: 14px auto;
      padding: 0 14px;
    }
    .count-badge {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 10px;
      font-weight: 500;
    }
    .letter-group {
      margin-bottom: 16px;
    }
    .letter-header {
      background: #e2e8f0;
      color: #1e3a8a;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      margin-bottom: 8px;
      display: inline-block;
    }
    .word-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .word-card {
      background: white;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .word-tati {
      font-weight: 700;
      color: #1e3a8a;
      font-size: 1.02rem;
    }
    .word-farsi {
      color: #475569;
      font-size: 0.92rem;
      text-align: left;
    }
    .empty-state {
      text-align: center;
      color: #94a3b8;
      padding: 40px 16px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <header>
    <h1>واژه‌نامه تاتی (ایزگیرینی)</h1>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="جستجوی واژه تاتی یا فارسی..." autocomplete="off">
    </div>
  </header>

  <div class="alphabet-bar" id="alphabetBar"></div>

  <div class="container">
    <div class="count-badge" id="countBadge">در حال بارگذاری...</div>
    <div id="wordListContainer"></div>
    <div class="empty-state" id="emptyState" style="display: none;">واژه‌ای یافت نشد.</div>
  </div>

  <script src="data.js"></script>

  <script>
    // کل قفل‌های ضد کپی و ضد پیست
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('cut', e => e.preventDefault());
    document.addEventListener('dragstart', e => e.preventDefault());
    document.addEventListener('selectstart', e => {
      if (e.target.tagName !== 'INPUT') e.preventDefault();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'F12' || ((e.ctrlKey || e.metaKey) && ['u', 's', 'c', 'p', 'a'].includes(e.key.toLowerCase()))) {
        e.preventDefault();
      }
    });

    // بارگذاری واژه‌ها (اگر data.js لود شود از آن می‌خواند، وگرنه از پشتیبان)
    let wordsData = [];
    if (typeof dictionaryData !== 'undefined' && Array.isArray(dictionaryData) && dictionaryData.length > 0) {
      wordsData = dictionaryData;
    } else if (typeof words !== 'undefined' && Array.isArray(words) && words.length > 0) {
      wordsData = words;
    }

    let selectedLetter = 'ALL';

    function getFirstLetter(word) {
      if (!word) return '';
      const ch = word.trim().charAt(0);
      if (ch === 'آ' || ch === 'ا') return 'الف';
      return ch;
    }

    function initDictionary() {
      wordsData.sort((a, b) => a.tati.localeCompare(b.tati, 'fa'));
      buildAlphabetBar();
      renderWords(wordsData);
      document.getElementById('searchInput').addEventListener('input', handleFilter);
    }

    function buildAlphabetBar() {
      const bar = document.getElementById('alphabetBar');
      bar.innerHTML = '';

      const letters = new Set();
      wordsData.forEach(w => {
        if (w.tati) letters.add(getFirstLetter(w.tati));
      });

      const sortedLetters = Array.from(letters).sort((a, b) => a.localeCompare(b, 'fa'));

      const allBtn = document.createElement('button');
      allBtn.className = 'alpha-btn active';
      allBtn.textContent = 'همه';
      allBtn.onclick = () => filterByLetter('ALL', allBtn);
      bar.appendChild(allBtn);

      sortedLetters.forEach(ltr => {
        const btn = document.createElement('button');
        btn.className = 'alpha-btn';
        btn.textContent = ltr;
        btn.onclick = () => filterByLetter(ltr, btn);
        bar.appendChild(btn);
      });
    }

    function filterByLetter(letter, btnElement) {
      selectedLetter = letter;
      document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      handleFilter();
    }

    function handleFilter() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      let filtered = wordsData;

      if (selectedLetter !== 'ALL') {
        filtered = filtered.filter(item => getFirstLetter(item.tati) === selectedLetter);
      }

      if (q) {
        filtered = filtered.filter(item => 
          (item.tati && item.tati.toLowerCase().includes(q)) || 
          (item.farsi && item.farsi.toLowerCase().includes(q))
        );
      }

      renderWords(filtered);
    }

    function renderWords(list) {
      const container = document.getElementById('wordListContainer');
      const countBadge = document.getElementById('countBadge');
      const emptyState = document.getElementById('emptyState');

      container.innerHTML = '';
      countBadge.textContent = `${list.length} واژه`;

      if (list.length === 0) {
        emptyState.style.display = 'block';
        return;
      }
      emptyState.style.display = 'none';

      const groups = {};
      list.forEach(item => {
        const ltr = getFirstLetter(item.tati);
        if (!groups[ltr]) groups[ltr] = [];
        groups[ltr].push(item);
      });

      Object.keys(groups).forEach(letter => {
        const grpDiv = document.createElement('div');
        grpDiv.className = 'letter-group';

        const title = document.createElement('div');
        title.className = 'letter-header';
        title.textContent = letter;
        grpDiv.appendChild(title);

        const listDiv = document.createElement('div');
        listDiv.className = 'word-list';

        groups[letter].forEach(item => {
          const card = document.createElement('div');
          card.className = 'word-card';
          card.innerHTML = `
            <span class="word-tati">${item.tati}</span>
            <span class="word-farsi">${item.farsi}</span>
          `;
          listDiv.appendChild(card);
        });

        grpDiv.appendChild(listDiv);
        container.appendChild(grpDiv);
      });
    }

    initDictionary();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
