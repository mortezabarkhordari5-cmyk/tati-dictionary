<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>واژه‌نامه تاتی ایزگیرینی</title>
    <style>
        body { font-family: Tahoma, sans-serif; padding: 20px; background: #f4f4f9; text-align: right; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #007bff; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: right; }
        th { background-color: #007bff; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>واژه‌نامه تاتی ایزگیرینی</h1>
        <input type="text" id="searchInput" placeholder="جست‌وجوی واژه...">
        <p>تعداد واژه‌ها: <span id="count">0</span></p>
        <table id="wordTable">
            <thead><tr><th>واژه تاتی</th><th>معنی فارسی</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    <script>
        const words = [
            ["آبا", "مادر"], ["آتا", "پدر"], ["لیچ", "زیر سقف اتاق یا زیر پشت بام چوبی"], ["مورچانَه", "مورچه"],
            ["خَر", "الاغ"], ["اسپ", "اسب"], ["گاو", "گاو"], ["گوسفند", "گوسفند"], ["بِز", "بز"],
            ["سگ", "سگ"], ["گربه", "گربه"], ["مرغ", "مرغ"], ["خروس", "خروس"], ["تُخم مرغ", "تخم مرغ"],
            ["شیر", "شیر"], ["ماست", "ماست"], ["دوغ", "دوغ"], ["کره", "کره"], ["پنیر", "پنیر"],
            ["نون", "نان"], ["اَو", "آب"], ["چای", "چای"], ["قند", "قند"], ["شکر", "شکر"],
            ["نمک", "نمک"], ["فلفل", "فلفل"], ["زردچوبه", "زردچوبه"], ["پیاز", "پیاز"], ["سیر", "سیر"],
            ["سیب", "سیب"], ["انار", "انار"], ["انگور", "انگور"], ["گردو", "گردو"], ["بادام", "بادام"],
            ["کشمش", "کشمش"], ["خربزه", "خربزه"], ["هندوانه", "هندوانه"], ["خیار", "خیار"], ["گوجه", "گوجه"],
            ["سیب زمینی", "سیب زمینی"], ["هویج", "هویج"], ["کدو", "کدو"], ["بادمجان", "بادمجان"], ["سبزی", "سبزی"],
            ["درخت", "درخت"], ["گل", "گل"], ["علف", "علف"], ["کوه", "کوه"], ["دشت", "دشت"],
            ["رودخانه", "رودخانه"], ["چشمه", "چشمه"], ["آفتاب", "آفتاب"], ["ماه", "ماه"], ["ستاره", "ستاره"],
            ["ابرا", "ابر"], ["باران", "باران"], ["برف", "برف"], ["تگرگ", "تگرگ"], ["باد", "باد"],
            ["صدا", "صدا"], ["خنده", "خنده"], ["گریه", "گریه"], ["خواب", "خواب"], ["بیداری", "بیداری"],
            ["خانه", "خانه"], ["اتاق", "اتاق"], ["در", "در"], ["پنجره", "پنجره"], ["دیوار", "دیوار"],
            ["سقف", "سقف"], ["زمین", "زمین"], ["حیاط", "حیاط"], ["کوچه", "کوچه"], ["خیابان", "خیابان"],
            ["شهر", "شهر"], ["روستا", "روستا"], ["مرد", "مرد"], ["زن", "زن"], ["پسر", "پسر"],
            ["دختر", "دختر"], ["برادر", "برادر"], ["خواهر", "خواهر"], ["عمو", "عمو"], ["عمه", "عمه"],
            ["دایی", "دایی"], ["خاله", "خاله"], ["پدربزرگ", "پدربزرگ"], ["مادربزرگ", "مادربزرگ"], ["نوه", "نوه"],
            ["دست", "دست"], ["پا", "پا"], ["سر", "سر"], ["چشم", "چشم"], ["گوش", "گوش"],
            ["بینی", "بینی"], ["دهان", "دهان"], ["دندان", "دندان"], ["زبان", "زبان"], ["مو", "مو"],
            ["لباس", "لباس"], ["کفش", "کفش"], ["جوراب", "جوراب"], ["شلوار", "شلوار"], ["هواپیما", "هواپیما"], ["قطار", "قطار"], ["کشتی", "کشتی"], ["کتاب", "کتاب"], ["مداد", "مداد"], ["کاغذ", "کاغذ"],
            ["نامه", "نامه"], ["ساعت", "ساعت"], ["تلفن", "تلفن"], ["ماشین", "ماشین"], ["موتور", "موتور"],
            ["دوچرخه", "دوچرخه"], ["هواپیما", "هواپیما"], ["قطار", "قطار"], ["کشتی", "کشتی"], ["قایق", "قایق"],
            ["کار", "کار"], ["بازی", "بازی"], ["درس", "درس"], ["مدرسه", "مدرسه"], ["دانشگاه", "دانشگاه"],
            ["معلم", "معلم"], ["شاگرد", "شاگرد"], ["دکتر", "دکتر"], ["بیمارستان", "بیمارستان"], ["دارو", "دارو"],
            ["پول", "پول"], ["بازار", "بازار"], ["دکان", "دکان"], ["خرید", "خرید"], ["فروش", "فروش"]
        ];

        const input = document.getElementById('searchInput');
        const tableBody = document.getElementById('tableBody');
        const count = document.getElementById('count');

        function render(filter = "") {
            tableBody.innerHTML = "";
            let n = 0;
            words.forEach(w => {
                if (w[0].includes(filter) || w[1].includes(filter)) {
                    n++;
                    let row = `<tr><td>${w[0]}</td><td>${w[1]}</td></tr>`;
                    tableBody.innerHTML += row;
                }
            });
            count.innerText = n;
        }

        input.addEventListener('input', (e) => render(e.target.value));
        render();
    </script>
</body>
</html>
