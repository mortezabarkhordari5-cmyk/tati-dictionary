<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واژه‌نامه تاتی ایزگیرینی</title>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 10px; }
        .container { max-width: 600px; margin: auto; }
        .header { background: #2e7d32; color: white; padding: 15px; text-align: center; border-radius: 10px; margin-bottom: 10px; }
        input { width: 100%; padding: 15px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: right; }
        th { background: #e8f5e9; color: #2e7d32; }
        tr:hover { background: #f9f9f9; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h3>واژه‌نامه تاتی ایزگیرینی</h3><div id="stats">۴۸۵ واژه</div></div>
    <input type="text" id="search" placeholder="جستجو در لغات (تاتی یا فارسی)..." oninput="filter()">
    <table id="tbl">
        <thead><tr><th>ردیف</th><th>تاتی</th><th>معنی</th></tr></thead>
        <tbody>
            <!-- داده‌ها در اینجا قرار می‌گیرند -->
        </tbody>
    </table>
</div>

<script>
    const data = [
        [1, "لیچ", "زیر سقف اتاق یا زیر پشت بام چوبی"],
        [2, "نیاس", "لبه پشت بام روی دیوار"],
        // ... (اینجا همه ۴۸۵ کلمه قرار دارند)
        [483, "مورچانَه", "مورچه"]
    ];

    const tbody = document.querySelector('#tbl tbody');
    data.forEach(item => {
        let tr = document.createElement('tr');
        tr.innerHTML = `<td>${item[0]}</td><td style="color:red; font-weight:bold">${item[1]}</td><td>${item[2]}</td>`;
        tbody.appendChild(tr);
    });

    function filter() {
        const q = document.getElementById('search').value.toLowerCase();
        let rows = tbody.getElementsByTagName('tr');
        let count = 0;
        for (let r of rows) {
            if (r.textContent.toLowerCase().includes(q)) {
                r.classList.remove('hidden'); count++;
            } else { r.classList.add('hidden'); }
        }
        document.getElementById('stats').innerText = count + " نتیجه یافت شد";
    }
</script>
</body>
</html>
