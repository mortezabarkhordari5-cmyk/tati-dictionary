        ];

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fa-IR';
            window.speechSynthesis.speak(utterance);
        }

        function render(filter = '') {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';
            words.filter(w => w.tati.includes(filter) || w.fa.includes(filter)).forEach(w => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `<div class="tati">${w.tati}</div><div class="fa">${w.fa}</div>`;
                div.onclick = () => speak(w.tati);
                resultsDiv.appendChild(div);
            });
        }

        document.getElementById('search').oninput = (e) => render(e.target.value);
        render();
    </script>
</body>
</html>
