<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واژه‌نامه تاتی</title>
    <style>
        body { font-family: Tahoma, sans-serif; padding: 10px; background-color: #f9f9f9; }
        .search-box { width: 100%; padding: 15px; font-size: 16px; border-radius: 10px; border: 1px solid #ddd; margin-bottom: 15px; box-sizing: border-box; }
        .word-card { background: white; padding: 12px; margin-bottom: 8px; border-radius: 8px; border: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .tati-text { font-weight: bold; color: #d9534f; font-size: 18px; }
        .persian-text { color: #555; font-size: 14px; margin-top: 4px; }
        .speaker-btn { background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 5px; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>

    <input type="text" id="search" class="search-box" placeholder="جستجو کنید..." onkeyup="filterWords()">
    <div id="results"></div>

    <script>
        const DATA = [
            {"tati":"لیچ","fa":"زیر سقف اتاق یا زیر پشت بام چوبی"},
            {"tati":"نیاس","fa":"لبه پشت بام روی دیوار"},
            {"tati":"هَبوکَ","fa":"کوبیدن چیزی برای سفت شدن و محکم شدن آن"}
            // لغات خود را اینجا ادامه دهید...
        ];

        function speakWord(text) {
            // متوقف کردن صدای قبلی در صورت اجرا
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fa-IR'; 
            window.speechSynthesis.speak(utterance);
        }

        function render(list) {
            const container = document.getElementById('results');
            container.innerHTML = '';
            list.forEach(item => {
                const div = document.createElement('div');
                div.className = 'word-card';
                
                // ایجاد بخش متن
                const textDiv = document.createElement('div');
                textDiv.innerHTML = `<div class="tati-text">${item.tati}</div><div class="persian-text">${item.fa}</div>`;
                
                // ایجاد دکمه و اتصال صحیح به تابع
                const btn = document.createElement('button');
                btn.className = 'speaker-btn';
                btn.innerText = '🔊';
                btn.onclick = () => speakWord(item.tati);
                
                div.appendChild(textDiv);
                div.appendChild(btn);
                container.appendChild(div);
            });
        }

        function filterWords() {
            const query = document.getElementById('search').value;
            const filtered = DATA.filter(item => 
                item.tati.includes(query) || item.fa.includes(query)
            );
            render(filtered);
        }

        render(DATA);
    </script>
</body>
</html>
