<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>واژه‌نامه تاتی الموتی</title>
    <style>
        body { font-family: Tahoma; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; }
        td, th { border: 1px solid #ddd; padding: 8px; text-align: right; }
        th { background-color: #007bff; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>واژه‌نامه تاتی الموتی</h1>
        <input type="text" id="searchInput" placeholder="جستجو کنید...">
        <table>
            <thead><tr><th>واژه تاتی</th><th>معنی فارسی</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script src="data.js"></script>
    <script>
        const tbody = document.getElementById('tableBody');
        const searchInput = document.getElementById('searchInput');

        function render(q) {
            const filtered = words.filter(w => w[0].includes(q) || w[1].includes(q));
            tbody.innerHTML = filtered.map(w => `<tr><td>${w[0]}</td><td>${w[1]}</td></tr>`).join('');
        }

        searchInput.addEventListener('input', (e) => render(e.target.value));
        render("");
    </script>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    // پیدا کردن جدول و ردیف‌ها
    const table = document.querySelector('table');
    if (!table) return;

    const tbody = table.querySelector('tbody') || table;
    const rows = Array.from(tbody.querySelectorAll('tr')).filter(row => row.querySelector('td'));

    // تابع برای پاک کردن اِعراب (فتحه، ضمه، کسره و...) جهت مرتب‌سازی دقیق
    const cleanWord = (str) => {
      return str.replace(/[\u064B-\u065F\u0670]/g, '').trim();
    };

    // مرتب‌سازی بر اساس ستون اول (واژه تاتی) بر اساس الفبای فارسی
    rows.sort((a, b) => {
      const wordA = cleanWord(a.children[0].textContent);
      const wordB = cleanWord(b.children[0].textContent);
      return wordA.localeCompare(wordB, 'fa');
    });

    // قرار دادن دوباره ردیف‌ها در جدول با ترتیب الفبایی
    rows.forEach(row => tbody.appendChild(row));
  });
</script>
</body>
</html>
