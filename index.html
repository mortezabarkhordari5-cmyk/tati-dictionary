<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لغت‌نامه تاتی الموتی</title>
    <!-- لود فونت زیبای وزیرمتن -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <style>
        /* جلوگیری کامل از انتخاب متن و کپی در تمام صفحه */
        * {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
            box-sizing: border-box;
        }

        body { 
            font-family: 'Vazirmatn', Tahoma, sans-serif; 
            background: #f4f7f5; 
            color: #264653; 
            margin: 0; 
            padding: 15px; 
            padding-bottom: 95px; 
            text-align: center; 
        }

        h1 { 
            color: #1b4332; 
            margin-bottom: 5px; 
            font-weight: 800;
            font-size: 1.8rem;
        }

        #author { 
            color: #52796f; 
            font-size: 0.95rem; 
            margin-top: 0; 
            margin-bottom: 15px; 
            font-weight: 500;
        }

        .search-box {
            max-width: 480px;
            margin: 0 auto 12px auto;
        }

        input[type="text"] { 
            width: 100%; 
            padding: 13px 20px; 
            font-size: 15px; 
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            border: 2px solid #b7e4c7; 
            border-radius: 30px; 
            outline: none; 
            background-color: #fff;
            -webkit-user-select: text !important;
            user-select: text !important;
        }

        input[type="text"]:focus {
            border-color: #2d6a4f;
        }

        #count { 
            font-size: 0.95rem; 
            color: #40916c; 
            margin-bottom: 15px; 
            font-weight: 700;
        }

        /* کارت‌های لغات */
        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 9px;
            max-width: 500px;
            margin: 0 auto;
        }

        .word-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 13px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            border: 1px solid #e0ebe6;
            text-align: right;
        }

        .word-tati {
            color: #1b4332;
            font-weight: 700;
            font-size: 1.15rem;
            width: 45%;
        }

        .word-divider {
            color: #cce3de;
            padding: 0 5px;
        }

        .word-persian {
            color: #495057;
            font-size: 0.95rem;
            width: 55%;
            text-align: left;
            direction: rtl;
        }

        /* نوار ثابت پایین */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(8px);
            box-shadow: 0 -3px 12px rgba(0,0,0,0.07);
            padding: 10px 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
            z-index: 100;
        }

        .nav-btn {
            flex: 1;
            max-width: 150px;
            background: #2d6a4f;
            color: white;
            border: none;
            padding: 10px 8px;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
        }

        .nav-btn.secondary { background: #52796f; }

        /* مودال‌ها */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-content {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            text-align: right;
        }

        .modal-content h3 {
            margin-top: 0;
            color: #1b4332;
            text-align: center;
        }

        .modal-content label {
            display: block;
            margin: 10px 0 4px;
            font-size: 0.85rem;
            color: #2d6a4f;
            font-weight: 600;
        }

        .modal-content input, .modal-content select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            margin-bottom: 8px;
            -webkit-user-select: text !important;
            user-select: text !important;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .modal-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-bale { background: #00a884; color: white; }
        .btn-close { background: #e0e0e0; color: #333; }
    </style>
</head>
<body oncontextmenu="return false;">

    <h1>لغت‌نامه تاتی الموتی</h1>
    <div id="author">اثر مرتضی برخورداری</div>

    <div class="search-box">
        <input type="text" id="search" placeholder="جستجو در واژگان تاتی یا فارسی..." onkeyup="searchWords()">
    </div>

    <div id="count">در حال بارگذاری واژگان...</div>

    <div class="cards-container" id="wordsContainer"></div>

    <div class="bottom-nav">
        <button class="nav-btn" onclick="openModal('suggestModal')">پیشنهاد واژه</button>
        <button class="nav-btn secondary" onclick="openModal('aboutModal')">درباره برنامه</button>
    </div>

    <!-- مودال پیشنهاد واژه -->
    <div class="modal" id="suggestModal">
        <div class="modal-content">
            <h3>پیشنهاد واژه جدید</h3>
            <label>واژه تاتی:</label>
            <input type="text" id="newTati" placeholder="مثال: چولیک">
            <label>معنی فارسی:</label>
            <input type="text" id="newPersian" placeholder="مثال: گنجشک">
            <label>نام شما / روستا:</label>
            <input type="text" id="senderName" placeholder="اختیاری">
            <div class="modal-buttons">
                <button class="modal-btn btn-bale" onclick="sendToBale()">ارسال به بله</button>
                <button class="modal-btn btn-close" onclick="closeModal('suggestModal')">بستن</button>
            </div>
        </div>
    </div>

    <!-- مودال درباره برنامه -->
    <div class="modal" id="aboutModal">
        <div class="modal-content">
            <h3>درباره لغت‌نامه تاتی الموتی</h3>
            <p style="font-size: 0.92rem; line-height: 1.8; color: #333;">
                گردآورنده: <b>مرتضی برخورداری</b><br><br>
                این اثر تلاشی است در جهت گردآوری و پاسداشت گویش کهن تاتی منطقه الموت.
            </p>
            <div class="modal-buttons">
                <button class="modal-btn btn-close" onclick="closeModal('aboutModal')">بستن</button>
            </div>
        </div>
    </div>

    <!-- بارگذاری داده‌ها -->
    <script src="data.js"></script>

    <script>
        // قفل کپی کلیک راست و کلیدهای میانبر
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.ctrlKey && (e.key === 'c' || e.key === 'C' || e.key === 'u' || e.key === 'U')) {
                e.preventDefault();
            }
        });

        let allWords = [];

        window.onload = function() {
            // شناسایی داده‌ها از data.js
            let rawList = null;
            if (typeof words !== 'undefined') rawList = words;
            else if (typeof wordsData !== 'undefined') rawList = wordsData;
            else if (typeof tatiData !== 'undefined') rawList = tatiData;

            if (rawList && Array.isArray(rawList)) {
                // تبدیل داده‌ها با در نظر گرفتن کلید farsi
                allWords = rawList.map(item => ({
                    tati: item.tati || '',
                    persian: item.farsi || item.persian || item.fa || ''
                }));
                displayWords(allWords);
            } else {
                document.getElementById('count').innerText = "خطا در خواندن داده‌ها";
            }
        };

        function displayWords(list) {
            const container = document.getElementById('wordsContainer');
            container.innerHTML = '';
            document.getElementById('count').innerText = `تعداد واژه‌ها: ${list.length.toLocaleString('fa-IR')}`;

            list.forEach(w => {
                const card = document.createElement('div');
                card.className = 'word-card';
                card.innerHTML = `
                    <div class="word-tati">${w.tati}</div>
                    <div class="word-divider">|</div>
                    <div class="word-persian">${w.persian}</div>
                `;
                container.appendChild(card);
            });
        }

        function searchWords() {
            const query = document.getElementById('search').value.trim().toLowerCase();
            if (!query) {
                displayWords(allWords);
                return;
            }
            const filtered = allWords.filter(w => 
                (w.tati && w.tati.toLowerCase().includes(query)) || 
                (w.persian && w.persian.toLowerCase().includes(query))
            );
            displayWords(filtered);
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function sendToBale() {
            const tati = document.getElementById('newTati').value.trim();
            const fa = document.getElementById('newPersian').value.trim();
            const sender = document.getElementById('senderName').value.trim() || 'ناشناس';

            if (!tati || !fa) {
                alert('لطفاً واژه و معنی آن را بنویسید.');
                return;
            }

            const text = encodeURIComponent(`پیشنهاد واژه برای لغت‌نامه تاتی الموتی:\n🔹 واژه: ${tati}\n🔹 معنی: ${fa}\n👤 فرستنده: ${sender}`);
            window.open(`https://ble.ir/share/url?url=${text}`, '_blank');
            closeModal('suggestModal');
        }
    </script>
</body>
</html>
