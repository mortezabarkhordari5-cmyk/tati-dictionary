<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>واژه‌نامه تاتی الموتی</title>
    <style>
        body { font-family: Tahoma; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; }
        td, th { border: 1px solid #ddd; padding: 8px; text-align: right; }
        th { background-color: #007bff; color: white; }
        * {
    -webkit-user-select: none;
    user-select: none;
}
input {
    user-select: auto;
}
    </style>
</head>
<body>
    <div class="container">
        <h1>واژه‌نامه تاتی الموتی</h1>
        <input type="text" id="searchInput" placeholder="جستجو کنید...">
        <table>
            <thead><tr><th>واژه تاتی</th><th>معنی فارسی</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script src="data.js"></script>
   <script>
    const words = JSON.parse(decodeURIComponent(escape(atob(rawWordsData))));

    words.sort((a, b) => a[0].localeCompare(b[0], 'fa'));

    const searchInput = document.getElementById("searchInput");
    const tableBody = document.getElementById("tableBody");

    function render(filter) {
        tableBody.innerHTML = "";
        words.forEach(item => {
            if (item[0].includes(filter) || item[1].includes(filter)) {
                let row = `<tr><td>${item[0]}</td><td>${item[1]}</td></tr>`;
                tableBody.innerHTML += row;
            }
        });
    }

    render("");

    searchInput.addEventListener("input", function() {
        render(this.value);
    });

    document.addEventListener('contextmenu', event => event.preventDefault());
    document.addEventListener('copy', event => event.preventDefault());
</script>
 
</body>
</html>
