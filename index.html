<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لغت‌نامه تاتی الموتی</title>
    <style>
        body {
            user-select: none;
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        #author { font-size: 16px; font-weight: bold; color: #555; margin-bottom: 20px; }
        
        /* استایل کادر جستجو */
        #search-input {
            width: 90%;
            max-width: 400px;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #3498db;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            border: 1px solid #e0e0e0;
            padding: 12px;
            text-align: right;
            font-size: 18px;
        }
        th { background-color: #3498db; color: white; }
        tr:nth-child(even) { background-color: #f2f6f8; }
    </style>
</head>
<body>

    <h1>لغت‌نامه تاتی الموتی</h1>
    <div id="author">اثر: مرتضی برخورداری</div>

    <!-- کادر جستجو -->
    <input type="text" id="search-input" placeholder="جستجو در تاتی یا فارسی..." onkeyup="filterTable()">

    <table id="dictionary-table">
        <thead>
            <tr>
                <th>تاتی</th>
                <th>فارسی</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <!-- کلمات اینجا لود می‌شوند -->
        </tbody>
    </table>

    <script src="data.js"></script>
    <script>
        const tableBody = document.getElementById('table-body');
        
        // مرتب‌سازی اولیه کلمات
        const sortedWords = typeof words !== 'undefined' ? [...words].sort((a, b) => a.tati.localeCompare(b.tati, 'fa')) : [];

        // تابع نمایش کلمات
        function renderTable(dataArray) {
            tableBody.innerHTML = '';
            if (dataArray.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="2" style="text-align:center; color:red;">کلمه‌ای یافت نشد.</td></tr>`;
                return;
            }
            dataArray.forEach(item => {
                const row = `<tr><td>${item.tati}</td><td>${item.farsi}</td></tr>`;
                tableBody.innerHTML += row;
            });
        }

        // تابع جستجو
        function filterTable() {
            const query = document.getElementById('search-input').value.trim();
            if (query === '') {
                renderTable(sortedWords);
                return;
            }
            const filtered = sortedWords.filter(item => 
                item.tati.includes(query) || item.farsi.includes(query)
            );
            renderTable(filtered);
        }

        // بارگذاری اولیه
        renderTable(sortedWords);
    </script>

</body>
</html>
