<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لغت‌نامه تاتی الموتی</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
            background: linear-gradient(180deg, #f0f4f8 0%, #f7f9fb 100%);
            min-height: 100vh;
            color: #2c3e50;
            margin: 0;
            padding: 16px 12px;
            padding-bottom: 90px;
            text-align: center;
        }

        h1 {
            color: #1a365d;
            margin: 10px 0 6px 0;
            font-size: 26px;
            font-weight: 800;
        }

        #author {
            font-size: 15px;
            font-weight: 700;
            color: #c0392b;
            margin-bottom: 16px;
            background: rgba(231, 76, 60, 0.08);
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
        }

        .sticky-header {
            position: sticky;
            top: 0;
            background: rgba(240, 244, 248, 0.95);
            backdrop-filter: blur(8px);
            padding: 10px 0;
            z-index: 1000;
        }

        #search-input {
            width: 95%;
            max-width: 460px;
            padding: 13px 18px;
            margin-bottom: 8px;
            border: 2px solid #3b82f6;
            border-radius: 14px;
            font-family: inherit;
            font-size: 16px;
            outline: none;
            background: #ffffff;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.12);
        }

        #search-input:focus {
            border-color: #1d4ed8;
            box-shadow: 0 6px 20px rgba(29, 78, 216, 0.2);
        }

        #result-count {
            font-size: 13px;
            color: #475569;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .table-container {
            width: 100%;
            max-width: 760px;
            margin: 8px auto 0 auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
            background: #fff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            text-align: right;
        }

        th, td {
            padding: 14px 16px;
            text-align: right;
            font-size: 17px;
            line-height: 1.6;
            border-bottom: 1px solid #edf2f7;
        }

        thead th {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            color: #ffffff;
            font-weight: 700;
            font-size: 17px;
            border: none;
        }

        thead th:first-child { width: 44%; }

        tbody tr { transition: background-color 0.15s ease; }
        tbody tr:nth-child(even) { background-color: #f8fafc; }
        tbody tr:hover { background-color: #e0f2fe; }

        tbody td:first-child {
            font-weight: 700;
            color: #1e3a8a;
            border-left: 1px solid #f1f5f9;
        }

        tbody td:last-child { color: #334155; }

        /* دکمه پخش صوتی */
        .speak-btn {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 6px;
            cursor: pointer;
            padding: 3px 7px;
            margin-left: 8px;
            font-size: 15px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            vertical-align: middle;
        }

        .speak-btn:hover {
            background: #3b82f6;
            transform: scale(1.1);
        }

        .speak-btn:active { transform: scale(0.95); }

        /* دکمه‌های پایین */
        .btn-float {
            position: fixed;
            bottom: 16px;
            z-index: 1000;
            padding: 12px 18px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            color: #fff;
            font-family: inherit;
            font-weight: 700;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .btn-float:active { transform: scale(0.96); }
        #suggestBtn { left: 16px; background: linear-gradient(135deg, #16a34a, #22c55e); }
        #moreBtn { right: 16px; background: linear-gradient(135deg, #0284c7, #38bdf8); }

        /* پاپ‌آپ‌ها */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10001;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(3px);
        }

        .custom-modal {
            display: none;
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 10002;
            width: min(92vw, 520px);
            max-height: 85vh;
            background: #fff;
            border-radius: 16px;
            padding: 18px;
            overflow-y: auto;
            text-align: right;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.25);
            font-family: inherit;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
            margin-bottom: 14px;
        }

        .modal-header h3 { margin: 0; color: #0f172a; font-size: 18px; font-weight: 700; }
        .close-btn { border: none; background: transparent; font-size: 26px; cursor: pointer; color: #94a3b8; }

        #village-search {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            margin-bottom: 12px;
            font-family: inherit;
            outline: none;
        }

        .filter-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .tab-btn {
            flex: 1;
            padding: 9px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            color: #475569;
        }

        .tab-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
        .village-item {
            padding: 13px 15px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
        }

        .village-detail-card { line-height: 1.8; text-align: right; }
        .village-title { margin-top: 0; color: #0f172a; font-size: 22px; border-bottom: 2px solid #3b82f6; padding-bottom: 8px; }
        .badge-section { display: inline-block; background: #e0f2fe; color: #0369a1; padding: 4px 12px; border-radius: 14px; font-size: 13px; margin-bottom: 12px; font-weight: 700; }
        .detail-row { margin-bottom: 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 14px; font-size: 14px; }
        .back-btn { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px 16px; font-size: 14px; cursor: pointer; font-weight: 700; margin-bottom: 14px; font-family: inherit; }

        @media (max-width: 600px) {
            h1 { font-size: 23px; }
            th, td { padding: 11px 9px; font-size: 15px; }
            .btn-float { padding: 10px 13px; font-size: 12px; }
            #suggestBtn { left: 8px; }
            #moreBtn { right: 8px; }
        }
    </style>
</head>
<body>

    <h1>لغت‌نامه تاتی الموتی</h1>
    <div id="author">اثر: مرتضی برخورداری</div>

    <div class="sticky-header">
        <input type="text" id="search-input" placeholder="جستجو در تاتی یا فارسی...">
        <div id="result-count"></div>
    </div>

    <div class="table-container">
        <table id="dictionary-table">
            <thead>
                <tr>
                    <th>تاتی</th>
                    <th>فارسی</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <button id="suggestBtn" class="btn-float"><span>➕</span> پیشنهاد واژه</button>
    <button id="moreBtn" class="btn-float"><span>📚</span> الموت‌شناسی</button>

    <div id="overlay" class="overlay"></div>

    <!-- مودال پیشنهاد واژه -->
    <div id="suggestModal" class="custom-modal">
        <div class="modal-header">
            <h3>پیشنهاد واژه جدید</h3>
            <button class="close-btn" onclick="closeAllModals()">&times;</button>
        </div>
        <input type="text" id="sugTati" placeholder="واژه تاتی (الزامی)" style="width:100%; padding:11px; margin-bottom:10px; border-radius:8px; border:1px solid #cbd5e1; font-family:inherit;">
        <input type="text" id="sugFarsi" placeholder="معنی فارسی (الزامی)" style="width:100%; padding:11px; margin-bottom:10px; border-radius:8px; border:1px solid #cbd5e1; font-family:inherit;">
        <textarea id="sugDesc" placeholder="مثال، تلفظ یا توضیحات (اختیاری)..." style="width:100%; padding:11px; margin-bottom:10px; height:85px; font-family:inherit; border-radius:8px; border:1px solid #cbd5e1;"></textarea>
        <input type="text" id="sugVillage" placeholder="نام شما یا روستای مربوطه (اختیاری)" style="width:100%; padding:11px; margin-bottom:12px; border-radius:8px; border:1px solid #cbd5e1; font-family:inherit;">
        <button id="sugSubmit" onclick="sendToBale()" style="width:100%; padding:13px; background:linear-gradient(135deg, #16a34a, #22c55e); color:white; border:none; border-radius:10px; cursor:pointer; font-weight:bold; font-size:15px; font-family:inherit;">ارسال در پیام‌رسان بله</button>
    </div>

    <!-- مودال الموت شناسی -->
    <div id="moreModal" class="custom-modal">
        <div class="modal-header">
            <h3 id="modal-title">روستاهای الموت</h3>
            <button class="close-btn" onclick="closeAllModals()">&times;</button>
        </div>
        <div id="list-view">
            <input type="text" id="village-search" placeholder="جستجوی نام روستا...">
            <div class="filter-tabs">
                <button class="tab-btn active" onclick="filterVillages('همه')">همه</button>
                <button class="tab-btn" onclick="filterVillages('شرقی')">شرقی</button>
                <button class="tab-btn" onclick="filterVillages('غربی')">غربی</button>
            </div>
            <div id="villages-container"></div>
        </div>
        <div id="detail-view" style="display:none;">
            <button class="back-btn" onclick="backToList()">🔙 بازگشت به لیست</button>
            <div id="village-detail-content"></div>
        </div>
    </div>

    <!-- بارگذاری داده‌ها -->
    <script src="data.js"></script>
    <script src="places.js"></script>

    <script>
        const tableBody = document.getElementById('table-body');
        const searchInput = document.getElementById('search-input');
        const resultCount = document.getElementById('result-count');

        // خواندن لغات از هر نام متغیری که در data.js تعریف شده باشد
        function getRawWordList() {
            if (typeof words !== 'undefined' && Array.isArray(words)) return words;
            if (typeof dictionaryData !== 'undefined' && Array.isArray(dictionaryData)) return dictionaryData;
            if (typeof tatiWords !== 'undefined' && Array.isArray(tatiWords)) return tatiWords;
            if (typeof data !== 'undefined' && Array.isArray(data)) return data;
            return [];
        }

        // تلفظ صوتی واژه با موتور هوشمند
        function speakWord(text) {
            const word = String(text || '').trim();
            if (!word) return;

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'fa-IR';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            } else {
                alert('مرورگر از پخش صوتی پشتیبانی نمی‌کند.');
            }
        }

        // حذف اعراب برای جستجو و مرتب‌سازی دقیق
        function cleanDiacritics(str) {
            return (str || '').replace(/[\u064B-\u065F\u0670]/g, '').trim();
        }

        // حذف لغات تکراری با حفظ ساختار
        function getUniqueWords(list) {
            const uniqueMap = new Map();

            list.forEach(function (word) {
                if (!word) return;
                const tatiText = String(word.tati || word.word || '').trim();
                if (!tatiText) return;

                const key = tatiText.normalize('NFC');
                const farsiText = String(word.farsi || word.meaning || '').trim().replace(/\.$/, '');

                if (!uniqueMap.has(key)) {
                    uniqueMap.set(key, { tati: tatiText, farsi: farsiText });
                } else {
                    const existingWord = uniqueMap.get(key);
                    const oldMeanings = existingWord.farsi.split('،').map(i => i.trim()).filter(Boolean);
                    if (farsiText && !oldMeanings.includes(farsiText)) {
                        oldMeanings.push(farsiText);
                        existingWord.farsi = oldMeanings.join('، ');
                    }
                }
            });

            return Array.from(uniqueMap.values());
        }

        function renderDict() {
            const val = searchInput.value.trim().toLowerCase();
            const rawList = getRawWordList();
            const list = getUniqueWords(rawList);

            const filtered = list.filter(function (word) {
                if (!val) return true;
                const tatiClean = cleanDiacritics(word.tati).toLowerCase();
                const farsiClean = cleanDiacritics(word.farsi).toLowerCase();

                return (
                    word.tati.toLowerCase().includes(val) ||
                    word.farsi.toLowerCase().includes(val) ||
                    tatiClean.includes(val) ||
                    farsiClean.includes(val)
                );
            });

            filtered.sort(function (a, b) {
                const aClean = cleanDiacritics(a.tati);
                const bClean = cleanDiacritics(b.tati);
                return aClean.localeCompare(bClean, 'fa');
            });

            if (filtered.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="2" style="text-align:center; color:#888; padding:20px;">واژه‌ای یافت نشد!</td></tr>`;
            } else {
                tableBody.innerHTML = filtered.map(function (word) {
                    const safeTati = encodeURIComponent(word.tati);
                    return `
                        <tr>
                            <td>
                                <button class="speak-btn" onclick="speakWord(decodeURIComponent('${safeTati}'))" title="پخش صوتی">🔊</button>
                                ${word.tati}
                            </td>
                            <td>${word.farsi}</td>
                        </tr>
                    `;
                }).join('');
            }

            resultCount.textContent = 'تعداد واژه‌ها: ' + filtered.length;
        }

        searchInput.addEventListener('input', renderDict);
        window.addEventListener('DOMContentLoaded', renderDict);
        renderDict();

        // مدیریت مودال‌ها
        const overlay = document.getElementById('overlay');
        function openModal(id) { overlay.style.display = 'block'; document.getElementById(id).style.display = 'block'; }
        function closeAllModals() {
            overlay.style.display = 'none';
            document.querySelectorAll('.custom-modal').forEach(m => m.style.display = 'none');
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('list-view').style.display = 'block';
        }

        document.getElementById('suggestBtn').onclick = () => openModal('suggestModal');
        document.getElementById('moreBtn').onclick = () => { openModal('moreModal'); renderVillages('همه'); };
        overlay.onclick = closeAllModals;

        function sendToBale() {
            const tati = document.getElementById('sugTati').value.trim();
            const farsi = document.getElementById('sugFarsi').value.trim();
            const desc = document.getElementById('sugDesc').value.trim();
            const village = document.getElementById('sugVillage').value.trim();

            if (!tati || !farsi) {
                alert('لطفاً واژه تاتی و معنی فارسی را وارد کنید.');
                return;
            }

            const text = `سلام، پیشنهاد واژه برای لغت‌نامه تاتی الموتی:\n\n🔹 واژه تاتی: ${tati}\n🔹 معنی فارسی: ${farsi}\n🔹 توضیح: ${desc}\n🔹 نام/روستا: ${village}`;
            const myId = 'MortezaBarkhordari';
            window.location.href = `https://ble.ir/${myId}?text=${encodeURIComponent(text)}`;
            closeAllModals();
        }

        let currentVillageFilter = 'همه';
        function renderVillages(filter, search) {
            currentVillageFilter = filter;
            const container = document.getElementById('villages-container');
            const list = (typeof alamutVillages !== 'undefined') ? alamutVillages : ((typeof villages !== 'undefined') ? villages : []);
            const searchVal = (search || '').trim().toLowerCase();

            const filtered = list.filter(function (v) {
                const regionName = v.region || v.section || '';
                const matchFilter = (filter === 'همه') || regionName.includes(filter);
                const matchSearch = !searchVal || (v.name && v.name.toLowerCase().includes(searchVal));
                return matchFilter && matchSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:15px; color:#888;">روستایی یافت نشد!</div>';
                return;
            }

            container.innerHTML = filtered.map(function (v) {
                const regionName = v.region || v.section || '';
                const enc = encodeURIComponent(v.name);
                return `
                    <div class="village-item" onclick="showDetail(decodeURIComponent('${enc}'))">
                        <span style="font-weight:bold;">${v.name}</span>
                        <span style="color:#2980b9; font-size:12px; background:#e1f0fa; padding:2px 8px; border-radius:10px;">${regionName}</span>
                    </div>
                `;
            }).join('');
        }

        function filterVillages(filter) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.innerText.trim() === filter));
            renderVillages(filter, document.getElementById('village-search').value);
        }

        document.getElementById('village-search').addEventListener('input', function (e) {
            renderVillages(currentVillageFilter, e.target.value);
        });

        function showDetail(vName) {
            const list = (typeof alamutVillages !== 'undefined') ? alamutVillages : ((typeof villages !== 'undefined') ? villages : []);
            const v = list.find(item => item.name === vName);
            if (!v) return;

            document.getElementById('list-view').style.display = 'none';
            document.getElementById('detail-view').style.display = 'block';

            const regionName = v.region || v.section || 'الموت';
            const descriptionText = v.description || 'توضیحاتی برای این روستا ثبت نشده است.';
            const popText = v.population ? `<div class="detail-row">👥 <strong>جمعیت:</strong> ${v.population}</div>` : '';
            const dehestanText = v.dehestan ? `<div class="detail-row">📍 <strong>دهستان:</strong> ${v.dehestan}</div>` : '';
            const souvenirsText = v.souvenirs ? `<div class="detail-row">🍯 <strong>محصولات و سوغات:</strong> ${v.souvenirs}</div>` : '';
            const customsText = v.customs ? `<div class="detail-row">🎉 <strong>آداب و رسوم:</strong> ${v.customs}</div>` : '';
            const attractionsText = v.attractions ? `<div class="detail-row">🏞️ <strong>جاذبه‌ها و دیدنی‌ها:</strong> ${v.attractions}</div>` : '';

            const enc = encodeURIComponent(v.name);
            document.getElementById('village-detail-content').innerHTML = `
                <div class="village-detail-card">
                    <h3 class="village-title">${v.name}</h3>
                    <div class="badge-section">${regionName}</div>
                    ${popText}
                    ${dehestanText}
                    ${souvenirsText}
                    ${customsText}
                    ${attractionsText}
                    <div class="detail-row" style="background:#f4f8fb; border-color:#d4e6f1;">
                        📜 <strong>معرفی و پیشینه:</strong><br>${descriptionText}
                    </div>
                    <button onclick="openWikiFrame(decodeURIComponent('${enc}'))" style="margin-top:15px; padding:10px 20px; background:#2980b9; color:white; border:none; border-radius:8px; font-family:inherit; font-size:14px; cursor:pointer; width:100%;">
                        🌐 مشاهده صفحه ویکی‌پدیا
                    </button>
                </div>
            `;
        }

        function openWikiFrame(vName) {
            const list = (typeof alamutVillages !== 'undefined') ? alamutVillages : ((typeof villages !== 'undefined') ? villages : []);
            const v = list.find(item => item.name === vName);
            if (!v) return;

            const wikiName = v.wiki || v.name;
            const enc = encodeURIComponent(v.name);
            document.getElementById('village-detail-content').innerHTML = `
                <div style="text-align:center; margin-bottom:10px;">
                    <button onclick="showDetail(decodeURIComponent('${enc}'))" style="padding:8px 16px; background:#e74c3c; color:white; border:none; border-radius:8px; font-family:inherit; font-size:13px; cursor:pointer;">
                        ↩️ بازگشت به مشخصات روستا
                    </button>
                </div>
                <iframe src="https://fa.m.wikipedia.org/wiki/${encodeURIComponent(wikiName)}" style="width:100%; height:70vh; border:1px solid #ccc; border-radius:8px;"></iframe>
            `;
        }

        function backToList() {
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('list-view').style.display = 'block';
        }
    </script>
</body>
</html>
