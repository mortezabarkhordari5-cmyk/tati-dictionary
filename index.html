                    <td>${item.farsi}</td>

                tbody.innerHTML += row;
            });
            document.getElementById('wordCount').innerText = `تعداد واژه‌ها: ${data.length}`;
        }

        function filterTable() {
            const input = document.getElementById('searchInput').value.trim().toLowerCase();
            const filtered = dictionaryData.filter(item => 
                item.tati.toLowerCase().includes(input) || 
                item.farsi.toLowerCase().includes(input)
            );
            renderTable(filtered);
