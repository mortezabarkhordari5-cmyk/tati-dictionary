<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لغت‌نامه تاتی الموتی</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', Tahoma, sans-serif; background: #f0f4f8; margin: 0; padding: 10px; }
        .sticky-header { position: sticky; top: 0; background: #f0f4f8; padding: 10px 0; z-index: 1000; }
        #search-input { width: 100%; padding: 12px; border: 2px solid #3b82f6; border-radius: 12px; font-size: 16px; outline:none; }
        .table-container { background: #fff; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow: hidden; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #3b82f6; color: white; padding: 12px; text-align: right; }
        td { padding: 12px; border-bottom: 1px solid #eee; text-align: right; font-size: 16px; }
        .speak-btn { background: #dbeafe; border: 1px solid #bfdbfe; border-radius: 6px; padding: 6px 10px; cursor: pointer; margin-left: 10px; }
        .btn-float { position: fixed; bottom: 20px; padding: 10px 20px; border-radius: 30px; border: none; color: white; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        #suggestBtn { left: 20px; background: #16a34a; }
        #moreBtn { right: 20px; background: #0284c7; }
    </style>
</head>
<body>

    <div class="sticky-header">
        <input type="text" id="search-input" placeholder="جستجو در تاتی یا فارسی...">
        <div id="result-count" style="font-size: 12px; margin-top:5px; color:#555;"></div>
    </div>

    <div class="table-container">
        <table>
            <thead><tr><th>تاتی</th><th>فارسی</th></tr></thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <button id="suggestBtn" class="btn-float" onclick="window.location.href='https://ble.ir/MortezaBarkhordari'">➕ پیشنهاد</button>
    <button id="moreBtn" class="btn-float">📚 الموت</button>

    <script src="data.js"></script>
    <script src="places.js"></script>

    <script>
        // شناسایی هوشمند لیست لغات از data.js
        function getWordList() {
            if (typeof words !== 'undefined') return words;
            if (typeof dictionaryData !== 'undefined') return dictionaryData;
            if (typeof data !== 'undefined') return data;
            return [];
        }

        // سیستم پخش صدای قدرتمند با استفاده از سرور گوگل (برای جلوگیری از خطای گوشی)
        function speakWord(text) {
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'fa-IR';
            // اگر موتور داخلی گوشی کار نکرد، از آدرس گوگل استفاده کن
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(msg);
            
            // چک کردن اینکه آیا صدا در حال پخش است یا خیر
            if (window.speechSynthesis.speaking === false) {
                const audio = new Audio(`https://translate.google.com/translate_tts?ie=UTF-8&tl=fa&client=tw-ob&q=${encodeURIComponent(text)}`);
                audio.play();
            }
        }

        function render() {
            const list = getWordList();
            const val = document.getElementById('search-input').value.trim().toLowerCase();
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            const filtered = list.filter(w => 
                (w.tati || w.word || '').toLowerCase().includes(val) || 
                (w.farsi || w.meaning || '').toLowerCase().includes(val)
            );

            filtered.forEach(w => {
                const tati = w.tati || w.word || '';
                const farsi = w.farsi || w.meaning || '';
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>
                        <button class="speak-btn" onclick="speakWord('${tati}')">🔊</button>
                        ${tati}
                    </td>
                    <td>${farsi}</td>
                `;
                tbody.appendChild(row);
            });
            document.getElementById('result-count').textContent = 'تعداد: ' + filtered.length;
        }

        document.getElementById('search-input').addEventListener('input', render);
        window.onload = render;
    </script>
</body>
</html>
