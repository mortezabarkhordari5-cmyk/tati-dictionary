<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لغت‌نامه تاتی الموتی</title>
    <style>
        body {
            user-select: none;
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        #author { font-size: 16px; font-weight: bold; color: #555; margin-bottom: 15px; }

        /* بخش ثابت بالای صفحه (کادر جستجو و شمارنده) */
        .sticky-header {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            background-color: #f9f9f9;
            padding-top: 10px;
            padding-bottom: 5px;
            z-index: 1000;
        }

        #search-input {
            width: 90%;
            max-width: 400px;
            padding: 12px;
            margin-bottom: 8px;
            border: 2px solid #3498db;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
            background: #fff;
        }
        #search-input:focus { border-color: #2c3e50; }

        #result-count {
            font-size: 14px;
            color: #777;
            margin-bottom: 8px;
            min-height: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: visible;
        }
        th, td {
            border: 1px solid #e0e0e0;
            padding: 12px;
            text-align: right;
            font-size: 18px;
        }
        
        /* ثابت ماندن سرستون جدول تاتی و فارسی زیر کادر جستجو */
        thead th {
            position: -webkit-sticky;
            position: sticky;
            top: 86px;
            background-color: #3498db;
            color: white;
            z-index: 999;
        }

        tr:nth-child(even) { background-color: #f2f6f8; }
        .not-found { text-align: center; color: #c0392b; }

        /* استایل‌های اختصاصی دکمه و فرم پیشنهاد واژه */
        #suggestBtn {
            position: fixed;
            left: 16px;
            bottom: 16px;
            z-index: 10000;
            padding: 11px 16px;
            border: none;
            border-radius: 25px;
            background: #27ae60;
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #suggestBtn:hover {
            background: #219150;
        }

        #suggestOverlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10001;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(2px);
        }

        #suggestModal {
            display: none;
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 10002;
            width: min(90vw, 440px);
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: right;
            padding: 18px;
            box-sizing: border-box;
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .modal-header h3 {
            margin: 0;
            font-size: 17px;
            color: #2c3e50;
        }
        .close-btn {
            border: none;
            background: transparent;
            font-size: 24px;
            line-height: 1;
            color: #888;
            cursor: pointer;
        }
        .form-group {
            margin-bottom: 12px;
            text-align: right;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #444;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #3498db;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-submit {
            flex: 1;
            background: #27ae60;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-cancel {
            background: #e0e0e0;
            color: #333;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 15px;
            cursor: pointer;
        }
        #sugMsg {
            font-size: 13px;
            color: #e74c3c;
            margin-bottom: 8px;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <h1>لغت‌نامه تاتی الموتی</h1>
    <div id="author">اثر: مرتضی برخورداری</div>

    <!-- کادر ثابت بالای صفحه -->
    <div class="sticky-header">
        <input type="text" id="search-input" placeholder="جستجو در تاتی یا فارسی..." autocomplete="off">
        <div id="result-count"></div>
    </div>

    <table id="dictionary-table">
        <thead>
            <tr>
                <th>تاتی</th>
                <th>فارسی</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>

    <!-- دکمه شناور پیشنهاد واژه -->
    <button id="suggestBtn">
        <span>➕</span> پیشنهاد واژه جدید
    </button>

    <!-- پنجره پاپ‌آپ ثبت واژه -->
    <div id="suggestOverlay"></div>
    <div id="suggestModal">
        <div class="modal-header">
            <h3>پیشنهاد واژه جدید</h3>
            <button class="close-btn" id="suggestClose">&times;</button>
        </div>

        <div id="sugMsg"></div>

        <div class="form-group">
            <label for="sugTati">واژه تاتی (الزامی):</label>
            <input type="text" id="sugTati" placeholder="مثال: کیجیک">
        </div>

        <div class="form-group">
            <label for="sugFarsi">معنی فارسی (الزامی):</label>
            <input type="text" id="sugFarsi" placeholder="مثال: دختر">
        </div>

        <div class="form-group">
            <label for="sugExample">مثال، تلفظ یا توضیحات (اختیاری):</label>
            <textarea id="sugExample" rows="2" placeholder="توضیح یا مثال در جمله..."></textarea>
        </div>

        <div class="form-group">
            <label for="sugSender">نام شما یا روستای مربوطه (اختیاری):</label>
            <input type="text" id="sugSender" placeholder="مثال: علی از آتان">
        </div>

        <div class="modal-actions">
            <button class="btn-submit" id="sugSubmit">ثبت</button>
            <button class="btn-cancel" id="sugCancel">انصراف</button>
        </div>
    </div>

    <!-- فایل دیتا -->
    <script src="data.js"></script>
    <script>
        /* ---------- ۱) ابزار یکسان‌سازی متن ---------- */
        const DIACRITICS = /[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g;
        const INVISIBLE  = /[\u200B-\u200F\u202A-\u202E\u2060\uFEFF]/g;
        const LETTER_MAP = {
            'ي': 'ی', 'ى': 'ی', 'ئ': 'ی', 'ك': 'ک',
            'أ': 'ا', 'إ': 'ا', 'آ': 'ا', 'ٱ': 'ا',
            'ة': 'ه', 'ۀ': 'ه', 'ؤ': 'و'
        };

        function normalizeText(text) {
            if (!text) return '';
            return String(text)
                .replace(DIACRITICS, '')
                .replace(INVISIBLE, '')
                .replace(/[يىئكأإآٱةۀؤ]/g, ch => LETTER_MAP[ch] || ch)
                .replace(/[٠-٩]/g, d => String.fromCharCode(d.charCodeAt(0) - 0x0660 + 0x06F0))
                .replace(/\s+/g, ' ')
                .trim();
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[c]);
        }

        /* ---------- ۲) آماده‌سازی داده‌ها و حذف موارد تکراری ---------- */
        const tableBody   = document.getElementById('table-body');
        const searchInput = document.getElementById('search-input');
        const countBox    = document.getElementById('result-count');

        const rawData = (typeof words !== 'undefined' && Array.isArray(words)) ? words : [];

        // حذف خودکار موارد کاملاً تکراری
        const uniqueSet = new Set();
        const cleanData = [];

        for (const item of rawData) {
            if (!item || !item.tati || !item.farsi) continue;
            const key = item.tati.trim() + '|||' + item.farsi.trim();
            if (!uniqueSet.has(key)) {
                uniqueSet.add(key);
                cleanData.push(item);
            }
        }

        // برای هر کلمه کلید جستجو بدون اعراب می‌سازیم
        const dictionary = cleanData.map(item => ({
            tati:     item.tati,
            farsi:    item.farsi,
            tatiKey:  normalizeText(item.tati),
            farsiKey: normalizeText(item.farsi)
        }));

        // مرتب‌سازی الفبایی
        dictionary.sort((a, b) => a.tatiKey.localeCompare(b.tatiKey, 'fa'));

        /* ---------- ۳) نمایش و جستجو ---------- */
        function render(list, query) {
            if (list.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="2" class="not-found">کلمه‌ای یافت نشد.</td></tr>';
                countBox.textContent = '';
                return;
            }

            let html = '';
            for (const item of list) {
                html += `<tr><td>${escapeHtml(item.tati)}</td><td>${escapeHtml(item.farsi)}</td></tr>`;
            }
            tableBody.innerHTML = html;

            countBox.textContent = query
                ? `${list.length} نتیجه برای «${query}»`
                : `تعداد کل کلمات: ${list.length}`;
        }

        function filterTable() {
            const query = normalizeText(searchInput.value);
            if (query === '') {
                render(dictionary, '');
                return;
            }
            const result = dictionary.filter(item =>
                item.tatiKey.includes(query) || item.farsiKey.includes(query)
            );
            render(result, searchInput.value.trim());
        }

        /* ---------- ۴) راه‌اندازی لغت‌نامه ---------- */
        searchInput.addEventListener('input', filterTable);

        if (dictionary.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="2" class="not-found">خطا: داده‌ای یافت نشد.</td></tr>';
        } else {
            render(dictionary, '');
        }

        /* ---------- ۵) منطق ارسال پیشنهاد به GitHub Issues ---------- */
        const btn = document.getElementById('suggestBtn');
        const overlay = document.getElementById('suggestOverlay');
        const modal = document.getElementById('suggestModal');
        const closeBtn = document.getElementById('suggestClose');
        const cancelBtn = document.getElementById('sugCancel');
        const submitBtn = document.getElementById('sugSubmit');
        const msg = document.getElementById('sugMsg');

        const tatiInput = document.getElementById('sugTati');
        const farsiInput = document.getElementById('sugFarsi');
        const exampleInput = document.getElementById('sugExample');
        const senderInput = document.getElementById('sugSender');

        function openModal() {
            msg.textContent = '';
            overlay.style.display = 'block';
            modal.style.display = 'block';
            setTimeout(() => tatiInput.focus(), 80);
        }

        function closeModal() {
            overlay.style.display = 'none';
            modal.style.display = 'none';
        }

        btn.addEventListener('click', openModal);
        overlay.addEventListener('click', closeModal);
        closeBtn.addEventListener('click', closeModal);
        cancelBtn.addEventListener('click', closeModal);

        submitBtn.addEventListener('click', function () {
            const tatiVal = tatiInput.value.trim();
            const farsiVal = farsiInput.value.trim();
            const exampleVal = exampleInput.value.trim();
            const senderVal = senderInput.value.trim();

            if (!tatiVal || !farsiVal) {
                msg.textContent = 'لطفاً واژه تاتی و معنی فارسی را بنویسید.';
                return;
            }

            const issueTitle = encodeURIComponent(`پیشنهاد واژه: ${tatiVal} = ${farsiVal}`);
            let bodyText = `### پیشنهاد واژه جدید\n\n`;
            bodyText += `- **واژه تاتی:** ${tatiVal}\n`;
            bodyText += `- **معنی فارسی:** ${farsiVal}\n`;
            if (exampleVal) bodyText += `- **توضیحات/مثال:** ${exampleVal}\n`;
            if (senderVal) bodyText += `- **پیشنهاد دهنده:** ${senderVal}\n`;

            const issueBody = encodeURIComponent(bodyText);
            const githubUrl = `https://github.com/mortezabarkhordari5-cmyk/tati-dictionary/issues/new?title=${issueTitle}&body=${issueBody}`;

            window.open(githubUrl, '_blank');
            closeModal();

            tatiInput.value = '';
            farsiInput.value = '';
            exampleInput.value = '';
            senderInput.value = '';
        });
    </script>
</body>
</html>
