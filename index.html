<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واژه‌نامه تاتی</title>
    <style>
        body { font-family: Tahoma, sans-serif; padding: 20px; }
        input { width: 100%; padding: 10px; margin-bottom: 20px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #999; padding: 8px; text-align: right; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <h1>واژه‌نامه تاتی</h1>
    <input type="text" id="searchInput" placeholder="جستجوی کلمه (تاتی یا فارسی)..." onkeyup="filterTable()">

    <table id="dictionaryTable">
        <thead>
            <tr>
                <th>تاتی</th>
                <th>فارسی</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- کلمات اینجا بارگذاری می‌شوند -->
        </tbody>
    </table>

    <script>
        let dictionaryData = [];

        // بارگذاری داده‌ها از فایل JSON
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                dictionaryData = data;
                renderTable(dictionaryData);
            });

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            data.forEach(item => {
                let row = `<tr>
                    <td>${item.tati}</td>
                    <td>${item.farsi}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        function filterTable() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const filtered = dictionaryData.filter(item => 
                item.tati.toLowerCase().includes(input) || 
                item.farsi.toLowerCase().includes(input)
            );
            renderTable(filtered);
        }
    </script>
</body>
</html>
