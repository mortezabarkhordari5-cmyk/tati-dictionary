<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لغت‌نامه تاتی الموتی</title>
    <style>
        body { font-family: Tahoma, sans-serif; padding: 20px; text-align: center; }
        .input-group { margin-bottom: 10px; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <h1>لغت‌نامه تاتی الموتی</h1>

    <!-- فرم پیشنهاد واژه -->
    <div id="suggestionForm">
        <h3>پیشنهاد واژه جدید</h3>
        <div class="input-group"><input type="text" id="sugTati" placeholder="واژه تاتی"></div>
        <div class="input-group"><input type="text" id="sugFarsi" placeholder="معنی فارسی"></div>
        <div class="input-group"><textarea id="sugDesc" placeholder="توضیح (اختیاری)"></textarea></div>
        <div class="input-group"><input type="text" id="sugVillage" placeholder="نام/روستا (اختیاری)"></div>
        <button onclick="sendToBale()">ارسال پیشنهاد به بله</button>
    </div>

    <script>
        // تابع ارسال به بله با قابلیت کپی در حافظه
        async function sendToBale() {
            const tati = document.getElementById('sugTati').value.trim();
            const farsi = document.getElementById('sugFarsi').value.trim();
            const desc = document.getElementById('sugDesc').value.trim();
            const village = document.getElementById('sugVillage').value.trim();

            if (!tati || !farsi) {
                alert("لطفاً واژه تاتی و معنی فارسی را حتماً وارد کنید.");
                return;
            }

            // متن پیام
            const text = `سلام، پیشنهاد واژه برای لغت‌نامه تاتی الموتی:\n\n🔹 واژه تاتی: ${tati}\n🔹 معنی فارسی: ${farsi}\n🔹 توضیح: ${desc}\n🔹 نام/روستا: ${village}`;
            const myId = "MortezaBarkhordari";
            const url = `https://ble.ir/${myId}?text=${encodeURIComponent(text)}`;

            // ۱. کپی خودکار در حافظه گوشی (Clipboard) به عنوان پشتیبان
            try {
                await navigator.clipboard.writeText(text);
                console.log("متن با موفقیت کپی شد.");
            } catch (err) {
                console.error("خطا در کپی متن:", err);
            }

            // ۲. باز کردن پیام‌رسان بله
            // سعی می‌کنیم در تب جدید باز کنیم
            const newTab = window.open(url, '_blank');
            
            // اگر مرورگر جلوی باز شدن را گرفت، در همین صفحه باز می‌کنیم
            if (!newTab) {
                window.location.href = url;
            }

            // ۳. اطلاع به کاربر
            alert("در حال باز کردن بله...\n\nاگر برنامه باز نشد، نگران نباشید! متن پیشنهاد شما 'کپی شده است'.\nکافیست وارد گفت‌وگوی من در بله شوید و دکمه Paste (چسباندن) را بزنید.");
        }

        function closeAllModals() {
            // اگر تابعی برای بستن مودال داری اینجا اضافه کن
            console.log("مودال بسته شد.");
        }
    </script>
</body>
</html>
