function normalizeText(str) {
  return str
    .replace(/[\u064B-\u065F\u0670]/g, '')
    .replace(/ي/g, 'ی')
    .replace(/ك/g, 'ک')
    .replace(/[\s\-_]/g, '')
    .toLowerCase();
}
