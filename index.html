<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لغت‌نامه تاتی الموتی</title>
    <style>
        body {
            user-select: none;
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            margin: 0;
            padding: 15px;
            padding-bottom: 85px;
            text-align: center;
        }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        #author { font-size: 16px; font-weight: bold; color: #555; margin-bottom: 15px; }

        /* بخش جستجو و شمارنده */
        .sticky-header {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            background-color: #f9f9f9;
            padding-top: 10px;
            padding-bottom: 5px;
            z-index: 1000;
        }

        #search-input {
            width: 90%;
            max-width: 400px;
            padding: 12px;
            margin-bottom: 8px;
            border: 2px solid #3498db;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
            background: #fff;
        }
        #search-input:focus { border-color: #2c3e50; }

        #result-count {
            font-size: 14px;
            color: #777;
            margin-bottom: 8px;
            min-height: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: visible;
        }
        th, td {
            border: 1px solid #e0e0e0;
            padding: 12px;
            text-align: right;
            font-size: 18px;
        }
        
        thead th {
            position: -webkit-sticky;
            position: sticky;
            top: 86px;
            background-color: #3498db;
            color: white;
            z-index: 999;
        }

        tr:nth-child(even) { background-color: #f2f6f8; }
        .not-found { text-align: center; color: #c0392b; }

        /* دکمه‌های شناور پایین */
        #suggestBtn {
            position: fixed;
            left: 16px;
            bottom: 16px;
            z-index: 10000;
            padding: 11px 16px;
            border: none;
            border-radius: 25px;
            background: #27ae60;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #suggestBtn:hover { background: #219150; }

        #moreBtn {
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 10000;
            padding: 11px 16px;
            border: none;
            border-radius: 25px;
            background: #2980b9;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #moreBtn:hover { background: #1c638e; }

        /* پاپ‌آپ‌ها */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10001;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(2px);
        }

        .custom-modal {
            display: none;
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 10002;
            width: min(92vw, 520px);
            max-height: 88vh;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: right;
            padding: 16px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }
        .modal-header h3 { margin: 0; font-size: 17px; color: #2c3e50; }
        .close-btn {
            border: none;
            background: transparent;
            font-size: 26px;
            line-height: 1;
            color: #888;
            cursor: pointer;
        }

        /* فرم پیشنهاد واژه */
        .form-group { margin-bottom: 12px; text-align: right; }
        .form-group label { display: block; font-size: 13px; color: #444; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea {
            width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc;
            border-radius: 8px; font-family: inherit; font-size: 14px; outline: none;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: #3498db; }
        .modal-actions { display: flex; gap: 10px; margin-top: 15px; }
        .btn-submit {
            flex: 1; background: #27ae60; color: #fff; border: none; padding: 10px;
            border-radius: 8px; font-family: inherit; font-size: 15px; cursor: pointer; font-weight: bold;
        }
        .btn-cancel {
            background: #e0e0e0; color: #333; border: none; padding: 10px 16px;
            border-radius: 8px; font-family: inherit; font-size: 15px; cursor: pointer;
        }
        #sugMsg { font-size: 13px; color: #e74c3c; margin-bottom: 8px; min-height: 18px; }

        /* کارت‌های روستا در لیست (قابل کلیک) */
        .village-item {
            background: #fff;
            border: 1px solid #dce4ec;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .village-item:hover, .village-item:active {
            background: #f4f8fb;
            border-color: #3498db;
            transform: translateX(-3px);
        }
        .village-title { font-size: 16px; font-weight: bold; color: #2c3e50; }
        .badge {
            background: #e8f4fd;
            color: #2980b9;
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: normal;
        }
        .arrow-icon { color: #3498db; font-size: 18px; }

        /* صفحه جزئیات هر روستا */
        #village-details-view { display: none; }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #ecf0f1;
            color: #2c3e50;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .back-btn:hover { background: #dfe6e9; }
        .detail-section-title {
            font-size: 14px;
            font-weight: bold;
            color: #2980b9;
            margin: 14px 0 6px 0;
            border-bottom: 1px dashed #cbd5e1;
            padding-bottom: 4px;
        }
        .detail-text { font-size: 14px; line-height: 1.7; color: #444; margin: 0; }
        
        .gallery-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 8px;
        }
        .gallery-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
        }
        .gallery-item img {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            display: block;
        }
        .gallery-caption {
            padding: 6px 10px;
            font-size: 12px;
            color: #555;
            background: #fff;
        }
        .proverb-item {
            background: #fef9e7;
            border-right: 4px solid #f39c12;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 6px;
            font-size: 13px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <h1>لغت‌نامه تاتی الموتی</h1>
    <div id="author">اثر: مرتضی برخورداری</div>

    <!-- کادر جستجو -->
    <div class="sticky-header">
        <input type="text" id="search-input" placeholder="جستجو در تاتی یا فارسی..." autocomplete="off">
        <div id="result-count"></div>
    </div>

    <!-- جدول واژگان -->
    <table id="dictionary-table">
        <thead>
            <tr>
                <th>تاتی</th>
                <th>فارسی</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>

    <!-- دکمه‌های شناور -->
    <button id="suggestBtn">
        <span>➕</span> پیشنهاد واژه
    </button>

    <button id="moreBtn">
        <span>📚</span> الموت‌شناسی
    </button>

    <!-- لایه تیره پس‌زمینه -->
    <div id="overlay" class="overlay"></div>

    <!-- پاپ‌آپ پیشنهاد واژه -->
    <div id="suggestModal" class="custom-modal">
        <div class="modal-header">
            <h3>پیشنهاد واژه جدید</h3>
            <button class="close-btn" id="suggestClose">&times;</button>
        </div>
        <div id="sugMsg"></div>
        <div class="form-group">
            <label for="sugTati">واژه تاتی (الزامی):</label>
            <input type="text" id="sugTati" placeholder="مثال: کیجیک">
        </div>
        <div class="form-group">
            <label for="sugFarsi">معنی فارسی (الزامی):</label>
            <input type="text" id="sugFarsi" placeholder="مثال: دختر">
        </div>
        <div class="form-group">
            <label for="sugExample">مثال، تلفظ یا توضیحات (اختیاری):</label>
            <textarea id="sugExample" rows="2" placeholder="توضیح یا مثال در جمله..."></textarea>
        </div>
        <div class="form-group">
            <label for="sugSender">نام شما یا روستا (اختیاری):</label>
            <input type="text" id="sugSender" placeholder="مثال: علی از گازرخان">
        </div>
        <div class="modal-actions">
            <button class="btn-submit" id="sugSubmit">ثبت و ارسال</button>
            <button class="btn-cancel" id="sugCancel">انصراف</button>
        </div>
    </div>

    <!-- پاپ‌آپ الموت‌شناسی (روستاها و جزئیات اختصاصی) -->
    <div id="moreModal" class="custom-modal">
        <div class="modal-header">
            <h3 id="modal-main-title">روستاهای الموت</h3>
            <button class="close-btn" id="moreClose">&times;</button>
        </div>

        <!-- نمای ۱: لیست روستاها -->
        <div id="villages-list-view">
            <p style="font-size:13px; color:#666; margin-top:0;">برای مشاهده تصاویر، تاریخچه و ضرب‌المثل‌ها، روی روستای مورد نظر بزنید:</p>
            <div id="villages-container"></div>
        </div>

        <!-- نمای ۲: صفحه جزئیات روستای انتخاب شده -->
        <div id="village-details-view">
            <button class="back-btn" onclick="backToVillagesList()">🔙 بازگشت به لیست روستاها</button>
            <div id="village-content"></div>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        /* ==========================================================
           داده‌های روستاها، تصاویر و ضرب‌المثل‌های هر روستا
           (به راحتی می‌توانید هر روستا را در اینجا کم، زیاد یا ویرایش کنید)
           ========================================================== */
        const villagesData = [
            {
                id: "gazer-khan",
                name: "گازُرخان",
                tag: "الموت شرقی",
                desc: "روستای تاریخی گازرخان در پای دژ مشهور الموت (حسن صباح) قرار دارد. این روستا دارای باغات گیلاس، آلبالو و گردو است و از مهم‌ترین قطب‌های گردشگری منطقه الموت به شمار می‌رود.",
                images: [
                    {
                        url: "https://images.unsplash.com/photo-1596401057633-54a8fe8ef647?w=600&auto=format&fit=crop&q=80",
                        title: "نمای دژ حسن صباح در بالای گازرخان"
                    }
                ],
                proverbs: [
                    { text: "آب از سر بُگذَرست", meaning: "کار از کار گذشته است." },
                    { text: "هر کِه بامِش بیش، برفِش بیشتر", meaning: "هر کس مقام یا امکانات بیشتری دارد، سختی‌هایش بیشتر است." }
                ]
            },
            {
                id: "moallem-kalayeh",
                name: "معلم‌کلایه",
                tag: "مرکز بخش الموت شرقی",
                desc: "معلم‌کلایه مرکز بخش رودبار الموت شرقی است و به عنوان قطب اداری و خدماتی منطقه شناخته می‌شود و دسترسی به تمام روستاهای الموت شرقی از این نقطه صورت می‌گیرد.",
                images: [],
                proverbs: [
                    { text: "دست دستِه می‌شوره، دست ورگردِه رویَه می‌شوره", meaning: "همکاری و کمک متقابل بین مردم." }
                ]
            },
            {
                id: "garmarud",
                name: "گرمارود",
                tag: "الموت شرقی",
                desc: "گرمارود از شرقی‌ترین و کهن‌ترین روستاهای الموت است که در انتهای دره شاهرود و مسیر کاروان‌روی قدیمی قزوین به مازندران (سه هزار) قرار دارد و دارای آبشارهای دیدنی است.",
                images: [],
                proverbs: []
            },
            {
                id: "razmian",
                name: "رازمیان",
                tag: "الموت غربی",
                desc: "مرکز بخش رودبار الموت غربی، دارای اقلیمی مناسب، شالیزارهای برنج و رودخانه خروشان نینه‌رود است. قلعه باستانی لمبسر در نزدیکی این شهر قرار دارد.",
                images: [],
                proverbs: []
            },
            {
                id: "andej",
                name: "اندج",
                tag: "طبیعت صخره‌ای",
                desc: "روستای اندج به خاطر دره‌های شگفت‌انگیز و صخره‌های تندیس‌مانند طبیعی در تمام ایران شهرت دارد. رودخانه اندج‌رود از میان باغات این دره می‌گذرد.",
                images: [],
                proverbs: []
            },
            {
                id: "atan",
                name: "آتان",
                tag: "روستای پلکانی",
                desc: "روستای کهن آتان به خاطر معماری ویژه پلکانی و سنتی‌اش شناخته می‌شود به گونه‌ای که حیاط هر خانه، پشت‌بام خانه پایینی است.",
                images: [],
                proverbs: []
            }
        ];

        /* ==========================================================
           ۱) یکسان‌سازی متن و جدول لغت‌نامه
           ========================================================== */
        const DIACRITICS = /[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g;
        const INVISIBLE  = /[\u200B-\u200F\u202A-\u202E\u2060\uFEFF]/g;
        const LETTER_MAP = {
            'ي': 'ی', 'ى': 'ی', 'ئ': 'ی', 'ك': 'ک',
            'أ': 'ا', 'إ': 'ا', 'آ': 'ا', 'ٱ': 'ا',
            'ة': 'ه', 'ۀ': 'ه', 'ؤ': 'و'
        };

        function normalizeText(text) {
            if (!text) return '';
            return String(text)
                .replace(DIACRITICS, '')
                .replace(INVISIBLE, '')
                .replace(/[يىئكأإآٱةۀؤ]/g, ch => LETTER_MAP[ch] || ch)
                .replace(/[٠-٩]/g, d => String.fromCharCode(d.charCodeAt(0) - 0x0660 + 0x06F0))
                .replace(/\s+/g, ' ')
                .trim();
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[c]);
        }

        const tableBody   = document.getElementById('table-body');
        const searchInput = document.getElementById('search-input');
        const countBox    = document.getElementById('result-count');

        const rawData = (typeof words !== 'undefined' && Array.isArray(words)) ? words : [];
        const uniqueSet = new Set();
        const cleanData = [];

        for (const item of rawData) {
            if (!item || !item.tati || !item.farsi) continue;
            const key = item.tati.trim() + '|||' + item.farsi.trim();
            if (!uniqueSet.has(key)) {
                uniqueSet.add(key);
                cleanData.push(item);
            }
        }

        const dictionary = cleanData.map(item => ({
            tati:     item.tati,
            farsi:    item.farsi,
            tatiKey:  normalizeText(item.tati),
            farsiKey: normalizeText(item.farsi)
        }));

        dictionary.sort((a, b) => a.tatiKey.localeCompare(b.tatiKey, 'fa'));

        function render(list, query) {
            if (list.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="2" class="not-found">کلمه‌ای یافت نشد.</td></tr>';
                countBox.textContent = '';
                return;
            }

            let html = '';
            for (const item of list) {
                html += `<tr><td>${escapeHtml(item.tati)}</td><td>${escapeHtml(item.farsi)}</td></tr>`;
            }
            tableBody.innerHTML = html;

            countBox.textContent = query
                ? `${list.length} نتیجه برای «${query}»`
                : `تعداد کل کلمات: ${list.length}`;
        }

        function filterTable() {
            const query = normalizeText(searchInput.value);
            if (query === '') {
                render(dictionary, '');
                return;
            }
            const result = dictionary.filter(item =>
                item.tatiKey.includes(query) || item.farsiKey.includes(query)
            );
            render(result, searchInput.value.trim());
        }

        searchInput.addEventListener('input', filterTable);

        if (dictionary.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="2" class="not-found">خطا: داده‌ای یافت نشد.</td></tr>';
        } else {
            render(dictionary, '');
        }

        /* ==========================================================
           ۲) مدیریت پاپ‌آپ‌ها
           ========================================================== */
        const overlay      = document.getElementById('overlay');
        const suggestModal = document.getElementById('suggestModal');
        const moreModal    = document.getElementById('moreModal');

        function closeAllModals() {
            overlay.style.display = 'none';
            suggestModal.style.display = 'none';
            moreModal.style.display = 'none';
        }

        overlay.addEventListener('click', closeAllModals);

        // پنجره پیشنهاد واژه
        const btnSuggest   = document.getElementById('suggestBtn');
        const closeSuggest = document.getElementById('suggestClose');
        const cancelSuggest= document.getElementById('sugCancel');
        const submitSuggest= document.getElementById('sugSubmit');
        const msg          = document.getElementById('sugMsg');

        const tatiInput    = document.getElementById('sugTati');
        const farsiInput   = document.getElementById('sugFarsi');
        const exampleInput = document.getElementById('sugExample');
        const senderInput  = document.getElementById('sugSender');

        btnSuggest.addEventListener('click', function() {
            msg.textContent = '';
            overlay.style.display = 'block';
            suggestModal.style.display = 'block';
            setTimeout(() => tatiInput.focus(), 80);
        });

        closeSuggest.addEventListener('click', closeAllModals);
        cancelSuggest.addEventListener('click', closeAllModals);

        submitSuggest.addEventListener('click', function () {
            const tatiVal = tatiInput.value.trim();
            const farsiVal = farsiInput.value.trim();
            const exampleVal = exampleInput.value.trim();
            const senderVal = senderInput.value.trim();

            if (!tatiVal || !farsiVal) {
                msg.textContent = 'لطفاً واژه تاتی و معنی فارسی را بنویسید.';
                return;
            }

            let message = `سلام، پیشنهاد واژه برای لغت‌نامه تاتی الموتی:\n\n`;
            message += `🔹 واژه تاتی: ${tatiVal}\n`;
            message += `🔹 معنی فارسی: ${farsiVal}\n`;
            if (exampleVal) message += `🔹 توضیحات/مثال: ${exampleVal}\n`;
            if (senderVal) message += `🔹 فرستنده: ${senderVal}\n`;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(message).catch(() => {});
            }

            const baleUrl = `https://ble.ir/MortezaBarkhordari?text=${encodeURIComponent(message)}`;
            window.open(baleUrl, '_blank');
            closeAllModals();

            tatiInput.value = '';
            farsiInput.value = '';
            exampleInput.value = '';
            senderInput.value = '';
        });

        /* ==========================================================
           ۳) سیستم لیست و جزئیات روستاها (الموت‌شناسی)
           ========================================================== */
        const btnMore   = document.getElementById('moreBtn');
        const closeMore = document.getElementById('moreClose');
        const villagesContainer = document.getElementById('villages-container');
        const listView = document.getElementById('villages-list-view');
        const detailsView = document.getElementById('village-details-view');
        const villageContent = document.getElementById('village-content');
        const modalTitle = document.getElementById('modal-main-title');

        btnMore.addEventListener('click', function() {
            backToVillagesList();
            overlay.style.display = 'block';
            moreModal.style.display = 'block';
        });

        closeMore.addEventListener('click', closeAllModals);

        // ساخت لیست روستاها
        function renderVillagesList() {
            let html = '';
            villagesData.forEach((v, index) => {
                html += `
                    <div class="village-item" onclick="openVillageDetails(${index})">
                        <div>
                            <span class="village-title">${escapeHtml(v.name)}</span>
                            ${v.tag ? `<span class="badge">${escapeHtml(v.tag)}</span>` : ''}
                        </div>
                        <span class="arrow-icon">‹</span>
                    </div>
                `;
            });
            villagesContainer.innerHTML = html;
        }

        // باز کردن صفحه جزئیات هر روستا
        function openVillageDetails(index) {
            const v = villagesData[index];
            modalTitle.textContent = `روستای ${v.name}`;
            
            let html = `
                <div class="detail-section-title">📖 درباره روستا</div>
                <p class="detail-text">${escapeHtml(v.desc || 'توضیحاتی ثبت نشده است.')}</p>
            `;

            // تصاویر
            if (v.images && v.images.length > 0) {
                html += `<div class="detail-section-title">📷 تصاویر</div><div class="gallery-grid">`;
                v.images.forEach(img => {
                    html += `
                        <div class="gallery-item">
                            <img src="${img.url}" alt="${escapeHtml(img.title || v.name)}" loading="lazy">
                            ${img.title ? `<div class="gallery-caption">${escapeHtml(img.title)}</div>` : ''}
                        </div>
                    `;
                });
                html += `</div>`;
            }

            // ضرب‌المثل‌ها
            if (v.proverbs && v.proverbs.length > 0) {
                html += `<div class="detail-section-title">💬 ضرب‌المثل‌ها و کنایه‌ها</div>`;
                v.proverbs.forEach(p => {
                    html += `
                        <div class="proverb-item">
                            <strong>«${escapeHtml(p.text)}»</strong><br>
                            <span>معنی: ${escapeHtml(p.meaning)}</span>
                        </div>
                    `;
                });
            }

            villageContent.innerHTML = html;
            listView.style.display = 'none';
            detailsView.style.display = 'block';
        }

        // بازگشت به لیست کلی روستاها
        function backToVillagesList() {
            modalTitle.textContent = 'روستاهای الموت';
            detailsView.style.display = 'none';
            listView.style.display = 'block';
        }

        // مقداردهی اولیه لیست روستاها
        renderVillagesList();
    </script>
</body>
</html>
