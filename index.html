<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>واژه‌نامه تاتی الموتی</title>
    <style>
        body { font-family: Tahoma; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        input { width: 100%; padding: 15px; margin-bottom: 20px; border: 1px solid #ccc; }
        table { width: 100%; border-collapse: collapse; }
        td, th { border: 1px solid #ddd; padding: 10px; text-align: right; }
        th { background-color: #007bff; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <h1>واژه‌نامه تاتی الموتی</h1>
        <input type="text" id="searchInput" placeholder="جستجو کنید...">
        <table>
            <thead><tr><th>واژه تاتی</th><th>معنی فارسی</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <!-- این فایل data.js را می‌خواند -->
    <script src="data.js"></script>
    <script>
        const tableBody = document.getElementById("tableBody");
        const searchInput = document.getElementById("searchInput");

        function render(filter = "") {
            tableBody.innerHTML = "";
            // جستجو در لیست
            const filtered = words.filter(item => 
                item[0].includes(filter) || item[1].includes(filter)
            );
            
            filtered.forEach(item => {
                tableBody.innerHTML += `<tr><td>${item[0]}</td><td>${item[1]}</td></tr>`;
            });
        }

        render(); // نمایش لیست کامل در ابتدا

        searchInput.addEventListener("input", function() {
            render(this.value);
        });
    </script>
</body>
</html>
