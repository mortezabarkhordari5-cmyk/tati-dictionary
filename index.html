<!DOCTYPE html>

<head>

  <title>واژه‌نامه تاتی ایزگیرینی</title>
  <style>
    /* قفل کردن کپی و سلکت متن در موبایل و کامپیوتر */
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      -khtml-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
    }

    body {
      background-color: #f4f6f8;
      margin: 0;
      padding: 12px;
    }

    .container {
      max-width: 650px;
      margin: auto;
    }

    .header {
      background-color: #2e7d32;
      color: white;
      text-align: center;
      padding: 18px 12px;
      border-radius: 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(46, 125, 50, 0.25);
    }

    .header h2 {
      margin: 0 0 6px 0;
      font-size: 22px;
    }

    .header .count {
      font-size: 14px;
      opacity: 0.95;
    }

    .search-box {
      margin-bottom: 12px;
      position: sticky;
      top: 10px;
      z-index: 10;
    }

    /* فیلد جستجو آزاد برای تایپ و فوکوس */
    .search-box input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #2e7d32;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      background: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      -webkit-touch-callout: default !important;
      -webkit-user-select: auto !important;
      user-select: auto !important;
    }

    .table-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 5px rgba(0,0,0,0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid #edf0f2;
    }

    th {
      background-color: #e8f5e9;
      color: #2e7d32;
      font-size: 15px;
      font-weight: bold;
      text-align: center;
    }

    td.id {
      color: #888;
      text-align: center;
      width: 12%;
      font-size: 13px;
    }

    td.tati {
      color: #c62828;
      font-weight: bold;
      font-size: 16px;
      text-align: center;
      width: 35%;
    }

    td.mean {
      color: #222;
      text-align: right;
      font-size: 14px;
      line-height: 1.5;
    }

    tr:last-child td {
      border-bottom: none;
    }
  </style>
</head>

    const digits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
    function toFa(num) {
      return String(num).replace(/[0-9]/g, d => digits[d]);
    }

    function render(data) {
      const tbody = document.getElementById("dictTable");
      const countEl = document.getElementById("resultCount");
      tbody.innerHTML = "";
      countEl.innerText = `${toFa(data.length)} واژه یافت شد`;

      let rows = "";
      data.forEach(item => {
        rows += `
          <tr>
            <td class="id">${toFa(item.n)}</td>
            <td class="tati">${item.w}</td>
            <td class="mean">${item.m}</td>
          </tr>
        `;
      });
      tbody.innerHTML = rows;
    }

    function filterWords() {
      const val = document.getElementById("searchInput").value.trim().toLowerCase();
      if (!val) {
        render(vocabList);
        return;
      }
      const filtered = vocabList.filter(item => 
        item.w.toLowerCase().includes(val) || item.m.toLowerCase().includes(val)
      );
      render(filtered);
    }

    render(vocabList);
