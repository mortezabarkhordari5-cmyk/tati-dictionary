<body>
    <h1>لغت‌نامه تاتی الموتی</h1>
    <div id="author">اثر: مرتضی برخورداری</div>
    
    <table id="dictionary-table">
        <thead>
            <tr>
                <th>تاتی</th>
                <th>فارسی</th>
            </tr>
        </thead>
        <tbody>
            <!-- کلمات اینجا لود می‌شوند -->
        </tbody>
    </table>

    <script>
        const tbody = document.querySelector('#dictionary-table tbody');
        window.words.forEach(item => {
            const row = `<tr><td>${item.tati}</td><td>${item.farsi}</td></tr>`;
            tbody.innerHTML += row;
        });
    </script>
</body>
