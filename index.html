<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>واژه‌نامه تاتی الموتی</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Tahoma; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        input { width: 100%; padding: 10px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        td, th { border: 1px solid #ddd; padding: 8px; }
        th { background-color: #007bff; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>واژه‌نامه تاتی الموتی</h1>
        <input type="text" id="searchInput" placeholder="جستجو کنید...">
        <table>
            <thead><tr><th>واژه تاتی</th><th>معنی فارسی</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        // اینجا مقادیر خود را از بخش Project Settings > API در Supabase کپی کن
        const supabase = supabase.createClient('YOUR_SUPABASE_URL', 'YOUR_ANON_KEY');

        const tableBody = document.getElementById("tableBody");
        const searchInput = document.getElementById("searchInput");

        async function fetchWords(filter = "") {
            let query = supabase.from('dictionary').select('*');
            if (filter) {
                query = query.or(`tati_word.ilike.%${filter}%,persian_meaning.ilike.%${filter}%`);
            }
            const { data } = await query;
            tableBody.innerHTML = "";
            data?.forEach(item => {
                tableBody.innerHTML += `<tr><td>${item.tati_word}</td><td>${item.persian_meaning}</td></tr>`;
            });
        }

        fetchWords();
        searchInput.addEventListener("input", (e) => fetchWords(e.target.value));
    </script>
</body>
</html>
