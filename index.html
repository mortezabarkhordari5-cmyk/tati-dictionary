<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واژه‌نامه تاتی</title>
    <style>
        body { font-family: Tahoma, sans-serif; text-align: center; padding: 20px; background-color: #f9f9f9; }
        h1 { margin-bottom: 20px; }
        input { width: 100%; max-width: 400px; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 20px; outline: none; box-sizing: border-box; }
        table { width: 100%; max-width: 500px; margin: 0 auto; border-collapse: collapse; background: #fff; }
        th, td { border: 1px solidوی کلمه (تاتی یا فارسی)...">

    <table id="dictionaryTable">
        <thead>
            <tr>
                <th>تاتی</th>
                <th>فارسی</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- کلمات اینجا بارگذاری می‌شوند -->
        </tbody>
    </table>

    <script>
        // کلمات خود را مستقیم اینجا اضافه کنید
        const dictionaryData = [
            { tati: "برا", farsi: "برادر" },
            { tati: "خوا", farsi: "خواهر" },
            { tati: "چمه", farsi: "مال من" }
        ];

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            data.forEach(item => {
                let row = `<tr>
                    <td>${item.tati}</td>
                    <td>${item.farsi}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        function filterTable() {
            const input = document.getElementById('searchInput').value.trim().toLowerCase();
            const filtered = dictionaryData.filter(item => 
                item.tati.toLowerCase().includes(input) || 
                item.farsi.toLowerCase().includes(input)
            );
            renderTable(filtered);
        }

        // اجرا در اولین بارگذاری
        renderTable(dictionaryData);
    </script>
</body>
</html>
