<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لغت‌نامه تاتی الموتی</title>
    <style>
        body { 
            user-select: none; 
            font-family: Tahoma, Arial, sans-serif; 
            background-color: #f9f9f9; 
            color: #333; 
            margin: 0; 
            padding: 15px; 
            padding-bottom: 85px; 
            text-align: center; 
        }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        #author { font-size: 16px; font-weight: bold; color: #555; margin-bottom: 12px; }
        
        .sticky-header { 
            position: sticky; 
            top: 0; 
            background-color: #f9f9f9; 
            padding-top: 8px; 
            padding-bottom: 8px; 
            z-index: 1000; 
        }
        #search-input { 
            width: 90%; 
            max-width: 420px; 
            padding: 12px 14px; 
            margin-bottom: 8px; 
            border: 2px solid #3498db; 
            border-radius: 10px; 
            font-size: 16px; 
            outline: none; 
            background: #fff; 
            box-sizing: border-box; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        #result-count { font-size: 14px; color: #555; margin-bottom: 6px; font-weight: bold; }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            background: #fff; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.08); 
            border-radius: 8px; 
            margin-top: 5px; 
            overflow: hidden;
        }
        th, td { 
            border: 1px solid #e0e0e0; 
            padding: 12px; 
            text-align: right; 
            font-size: 18px; 
        }
        thead th { 
            position: sticky; 
            top: 85px; 
            background-color: #3498db; 
            color: white; 
            z-index: 999; 
        }
        tr:nth-child(even) { background-color: #f4f8fb; }
        
        /* دکمه‌های شناور پایین */
        .btn-float { 
            position: fixed; 
            bottom: 16px; 
            z-index: 1000; 
            padding: 11px 18px; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer; 
            color: #fff; 
            font-weight: bold; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.25); 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            font-size: 14px;
        }
        #suggestBtn { left: 16px; background: #27ae60; }
        #moreBtn { right: 16px; background: #2980b9; }
        
        /* مودال‌ها */
        .overlay { display: none; position: fixed; inset: 0; z-index: 10001; background: rgba(0,0,0,0.55); backdrop-filter: blur(2px); }
        .custom-modal { display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 10002; width: min(94vw, 540px); max-height: 85vh; background: #fff; border-radius: 14px; padding: 16px; overflow-y: auto; text-align: right; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 12px; }
        .close-btn { border: none; background: transparent; font-size: 26px; cursor: pointer; color: #888; }
        #village-search { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; }
        .filter-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 8px; border: 1px solid #dce4ec; background: #f8fafc; border-radius: 6px; cursor: pointer; }
        .tab-btn.active { background: #3498db; color: #fff; }
        .village-item { padding: 12px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 6px; cursor: pointer; display: flex; justify-content: space-between; }
        .village-item:hover { background: #f4f8fb; }
    </style>
</head>
<body>

    <h1>لغت‌نامه تاتی الموتی</h1>
    <div id="author">اثر: مرتضی برخورداری</div>

    <div class="sticky-header">
        <input type="text" id="search-input" placeholder="جستجو در تاتی یا فارسی...">
        <div id="result-count"></div>
    </div>

    <table id="dictionary-table">
        <thead>
            <tr>
                <th>تاتی</th>
                <th>فارسی</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>

    <button id="suggestBtn" class="btn-float"><span>➕</span> پیشنهاد واژه</button>
    <button id="moreBtn" class="btn-float"><span>📚</span> الموت‌شناسی</button>

    <div id="overlay" class="overlay"></div>

    <!-- مودال پیشنهاد واژه -->
    <div id="suggestModal" class="custom-modal">
        <div class="modal-header"><h3>پیشنهاد واژه جدید</h3><button class="close-btn" onclick="closeAllModals()">&times;</button></div>
        
        <input type="text" id="sugTati" placeholder="واژه تاتی (الزامی)" style="width:100%; padding:10px; margin-bottom:10px; box-sizing:border-box;">
        <input type="text" id="sugFarsi" placeholder="معنی فارسی (الزامی)" style="width:100%; padding:10px; margin-bottom:10px; box-sizing:border-box;">
        <textarea id="sugDesc" placeholder="مثال، تلفظ یا توضیحات (اختیاری)..." style="width:100%; padding:10px; margin-bottom:10px; box-sizing:border-box; height:80px; font-family:inherit;"></textarea>
        <input type="text" id="sugVillage" placeholder="نام شما یا روستای مربوطه (اختیاری)" style="width:100%; padding:10px; margin-bottom:10px; box-sizing:border-box;">
        
        <button id="sugSubmit" onclick="sendSuggestion()" style="width:100%; padding:12px; background:#27ae60; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold; font-size:15px;">ارسال پیشنهاد</button>
    </div>

    <!-- مودال الموت شناسی -->
    <div id="moreModal" class="custom-modal">
        <div class="modal-header"><h3 id="modal-title">روستاهای الموت</h3><button class="close-btn" onclick="closeAllModals()">&times;</button></div>
        
        <div id="list-view">
            <input type="text" id="village-search" placeholder="جستجوی نام روستا...">
            <div class="filter-tabs">
                <button class="tab-btn active" onclick="filterVillages('همه')">همه</button>
                <button class="tab-btn" onclick="filterVillages('شرقی')">شرقی</button>
                <button class="tab-btn" onclick="filterVillages('غربی')">غربی</button>
            </div>
            <div id="villages-container"></div>
        </div>
        
        <div id="detail-view" style="display:none;">
            <button onclick="backToList()" style="margin-bottom:10px; padding:6px 12px; cursor:pointer;">🔙 بازگشت</button>
            <div id="village-detail-content"></div>
        </div>
    </div>

    <script src="data.js?v=4"></script>
    <script src="places.js?v=4"></script>

    <script>
        const tableBody = document.getElementById('table-body');
        const searchInput = document.getElementById('search-input');
        const resultCount = document.getElementById('result-count');

        // تابع حذف اعراب برای جستجو و مرتب‌سازی دقیق
        function cleanDiacritics(str) {
            return (str || '').replace(/[\u064B-\u065F\u0670]/g, '').trim();
        }

        function renderDict() {
            const val = searchInput.value.trim().toLowerCase();
            const list = (typeof words !== 'undefined') ? words : [];

            // ۱. فیلتر کردن طبق کادر جستجو
            const filtered = list.filter(w => {
                if (!val) return true;
                const tatiClean = cleanDiacritics(w.tati).toLowerCase();
                const farsiClean = cleanDiacritics(w.farsi).toLowerCase();
                return w.tati.toLowerCase().includes(val) || 
                       w.farsi.toLowerCase().includes(val) ||
                       tatiClean.includes(val) ||
                       farsiClean.includes(val);
            });

            // ۲. مرتب‌سازی الفبایی دقیق (آ تا ی) بر اساس ستون تاتی
            filtered.sort((a, b) => {
                const aClean = cleanDiacritics(a.tati);
                const bClean = cleanDiacritics(b.tati);
                return aClean.localeCompare(bClean, 'fa');
            });

            // ۳. نمایش در جدول
            tableBody.innerHTML = filtered.map(w => `<tr><td>${w.tati}</td><td>${w.farsi}</td></tr>`).join('');
            resultCount.textContent = `تعداد واژه‌ها: ${filtered.length}`;
        }

        searchInput.addEventListener('input', renderDict);
        renderDict(); // اجرای اولیه هنگام باز شدن صفحه

        // مدیریت مودال‌ها
        const overlay = document.getElementById('overlay');
        function openModal(id) { overlay.style.display = 'block'; document.getElementById(id).style.display = 'block'; }
        
        function closeAllModals() {
            overlay.style.display = 'none';
            document.querySelectorAll('.custom-modal').forEach(m => m.style.display = 'none');
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('list-view').style.display = 'block';
        }
        
        document.getElementById('suggestBtn').onclick = () => openModal('suggestModal');
        document.getElementById('moreBtn').onclick = () => { openModal('moreModal'); renderVillages('همه'); };
        overlay.onclick = closeAllModals;

        // تابع ارسال پیشنهاد هوشمند و بدون گیر کردن در صفحه سفید بله
        async function sendSuggestion() {
            const tati = document.getElementById('sugTati').value.trim();
            const farsi = document.getElementById('sugFarsi').value.trim();
            const desc = document.getElementById('sugDesc').value.trim();
            const village = document.getElementById('sugVillage').value.trim();

            if (!tati || !farsi) {
                alert("لطفاً واژه تاتی و معنی فارسی را وارد کنید.");
                return;
            }

            const text = `سلام، پیشنهاد واژه برای لغت‌نامه تاتی الموتی:\n\n🔹 واژه تاتی: ${tati}\n🔹 معنی فارسی: ${farsi}\n🔹 توضیح: ${desc}\n🔹 نام/روستا: ${village}`;
            const myId = "MortezaBarkhordari";

            // ۱. اگر اشتراک‌گذاری گوشی فعال باشد، لیست پیام‌رسان‌ها را برای کاربر باز می‌کند
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'پیشنهاد واژه تاتی',
                        text: text
                    });
                    closeAllModals();
                    return;
                } catch (err) {
                    // در صورت انصراف کاربر کاری انجام نمی‌شود
                }
            }

            // ۲. روش جایگزین: باز کردن مستقیم بله
            const appUrl = `ble://chat?username=${myId}&text=${encodeURIComponent(text)}`;
            const webUrl = `https://ble.ir/${myId}?text=${encodeURIComponent(text)}`;
            
            window.location.href = appUrl;
            setTimeout(() => {
                window.location.href = webUrl;
            }, 800);

            closeAllModals();
        }

        function renderVillages(filter, search = '') {
            const container = document.getElementById('villages-container');
            const list = (typeof alamutVillages !== 'undefined') ? alamutVillages : [];
            
            const filtered = list.filter(v => {
                const matchFilter = (filter === 'همه') || (v.section && v.section.includes(filter));
                const matchSearch = v.name && v.name.includes(search);
                return matchFilter && matchSearch;
            });

            container.innerHTML = filtered.map((v) => `
                <div class="village-item" onclick="showDetail('${v.name}')">
                    <span>${v.name}</span>
                    <span>${v.section}</span>
                </div>
            `).join('');
        }

        function filterVillages(f) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.innerText.includes(f)));
            renderVillages(f, document.getElementById('village-search').value);
        }

        document.getElementById('village-search').addEventListener('input', (e) => {
            const activeTab = document.querySelector('.tab-btn.active').innerText;
            renderVillages(activeTab, e.target.value);
        });

        function showDetail(vName) {
            const v = alamutVillages.find(item => item.name === vName);
            if (!v) return;

            document.getElementById('list-view').style.display = 'none';
            document.getElementById('detail-view').style.display = 'block';
            document.getElementById('village-detail-content').innerHTML = `
                <h3>${v.name}</h3>
                <p><strong>بخش:</strong> ${v.section}</p>
                <p>${v.desc || 'توضیحاتی موجود نیست.'}</p>
                <img src="${(v.photos && v.photos.length > 0) ? v.photos[0] : 'placeholder.jpg'}" style="width:100%; border-radius:8px;">
            `;
        }
        
        function backToList() {
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('list-view').style.display = 'block';
        }
    </script>
</body>
</html>
