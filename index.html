    h1 { margin: 0 0 6px; color: #1e293b; font-size: 1.5rem; }

    .stats { font-size: 0.85rem; color: #64748b; margin-bottom: 12px; text-align: left; }
    .word-list { display: flex; flex-direction: column; gap: 10px; }
    .word-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; transition: 0.15s; }
    .word-card:active { background: #f1f5f9; }
    .tati { font-weight: 700; color: #1e293b; font-size: 1.1rem; }
    .farsi { color: #475569; font-size: 0.95rem; text-align: left; max-width: 60%; }
    .no-result { text-align: center; padding: 30px; color: #94a3b8; font-size: 1rem; }
  </style>

    const matchCount = document.getElementById('matchCount');
    const noResult = document.getElementById('noResult');

    function render(list) {
      wordList.innerHTML = '';
      if (list.length === 0) {
        noResult.style.display = 'block';
        matchCount.textContent = 'موردی یافت نشد';
        return;
      }
      noResult.style.display = 'none';
      matchCount.textContent = `در حال نمایش ${list.length} واژه`;

      const fragment = document.createDocumentFragment();
      list.forEach(item => {
        const div = document.createElement('div');
        div.className = 'word-card';
        div.innerHTML = `<span class="tati">${item.t}</span><span class="farsi">${item.f}</span>`;
        fragment.appendChild(div);
      });
      wordList.appendChild(fragment);
    }

    render(dictionary);

    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (!q) {
        render(dictionary);
        return;
      }
      const filtered = dictionary.filter(item => 
        item.t.toLowerCase().includes(q) || item.f.toLowerCase().includes(q)
      );
      render(filtered);
    });
